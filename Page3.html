
<style>
#page3View{width:100%;max-width:100%;min-width:0;padding:12px 0 30px;color:#172033;font-family:Inter,"Segoe UI",Arial,sans-serif}#page3View *{box-sizing:border-box}

#page3View .p3-apply{grid-column:1/-1;justify-self:end;height:34px;border:0;border-radius:8px;background:#2563eb;color:#fff;padding:0 15px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap}

#page3View th:first-child,#page3View td:first-child{position:sticky;left:0;text-align:left;min-width:52px;z-index:9}#page3View th:first-child{background:#EDE6F8;z-index:12}#page3View td:first-child{background:#fff;box-shadow:2px 0 5px rgba(15,23,42,.08)}
#page3View th:nth-child(2),#page3View td:nth-child(2){text-align:left;min-width:210px}#page3View th:nth-child(3),#page3View td:nth-child(3){text-align:left;min-width:120px}
#page3View tr.p3-total td{position:sticky;bottom:0;background:#fff1cc;color:#173b70;font-weight:850;z-index:10;border-top:2px solid #d6a43b}#page3View tr.p3-total td:first-child{z-index:13;background:#fff1cc}
#page3View .p3-empty{text-align:center;color:#94a3b8;padding:20px}
@media(max-width:900px){#page3View .p3-controls{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:560px){#page3View .p3-controls{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:10px}#page3View .p3-control:first-child{grid-column:1/-1}#page3View .p3-apply{width:100%;justify-self:stretch}}
</style>
