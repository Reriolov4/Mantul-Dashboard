<style>
#p3View{padding:14px 0 28px;color:#172033;font-family:inherit}#p3View *{box-sizing:border-box}
#p3View .p3-head h1{font-size:21px;color:#173b70;margin:0 0 4px;font-weight:850}#p3View .p3-head p{font-size:11px;color:#718096;margin:0 0 12px}
#p3View .p3-card{background:#fff;border:1px solid #e5eaf1;border-radius:13px;padding:13px;margin-bottom:12px;box-shadow:0 3px 14px #14213d08}
#p3View .p3-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;align-items:start}
#p3View label{display:block;font-size:10px;font-weight:800;color:#64748b;margin:0 0 6px}
#p3View select,#p3View input[type=search]{height:36px;width:100%;border:1px solid #dbe3ee;border-radius:8px;padding:0 9px;font:inherit;font-size:11px;background:#fff;color:#172033}
#p3View .p3-checks,#p3View .p3-pills,#p3View .p3-switch{display:flex;flex-wrap:wrap;gap:5px;max-height:100px;overflow:auto}
#p3View .p3-check{display:inline-flex;align-items:center;gap:4px;border:1px solid #e2e8f0;border-radius:7px;padding:5px 7px;font-size:10px;color:#334155}
#p3View .p3-pills button,#p3View .p3-switch button{border:0;border-radius:18px;background:#f0f4f9;color:#53657c;padding:7px 11px;font-size:10px;font-weight:800;cursor:pointer}
#p3View .p3-pills button.active,#p3View .p3-switch button.active{background:#2563eb;color:white}
#p3View .p3-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:12px}
#p3View .p3-actions button,#p3View .p3-pagination button{border:0;border-radius:8px;background:#2563eb;color:#fff;padding:8px 13px;font-size:10px;font-weight:800;cursor:pointer}
#p3View .p3-actions .secondary{background:#edf2f8;color:#365477}
#p3View .p3-status{font-size:10px;color:#718096;margin:7px 2px 10px;min-height:15px}
#p3View .p3-summary{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:11px}
#p3View .p3-summary div{background:#fff;border:1px solid #e5eaf1;border-radius:9px;padding:8px 12px;min-width:135px}
#p3View .p3-summary small{display:block;font-size:9px;color:#718096;font-weight:800}#p3View .p3-summary b{display:block;font-size:15px;color:#173b70;margin-top:3px}
#p3View .p3-table{background:#fff;border:1px solid #e5eaf1;border-radius:13px;overflow:hidden}
#p3View .p3-table-head{padding:12px 14px 8px;display:flex;justify-content:space-between;gap:8px;align-items:center}#p3View .p3-table-head h2{font-size:13px;color:#173b70;margin:0}#p3View .p3-table-head span{font-size:10px;color:#718096}
#p3View .p3-scroll{overflow:auto;max-height:650px;max-width:100%}#p3View table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:10px;white-space:nowrap}
#p3View th,#p3View td{padding:8px 9px;border-bottom:1px solid #e8edf5;text-align:right;min-width:85px}
#p3View thead th{position:sticky;top:0;background:#173b70;color:#fff;z-index:4}
#p3View th:first-child,#p3View td:first-child{position:sticky;left:0;text-align:left;min-width:220px;max-width:280px;overflow:hidden;text-overflow:ellipsis;z-index:5}
#p3View thead th:first-child{z-index:8}#p3View tbody td:first-child{background:#fff}
#p3View td:nth-child(2),#p3View th:nth-child(2){text-align:left;min-width:110px}
#p3View .p3-total td{background:#fff1cc;color:#173b70;font-weight:850;position:sticky;bottom:0;z-index:6}
#p3View .p3-pagination{display:flex;justify-content:space-between;align-items:center;padding:10px 13px;font-size:10px;color:#64748b}
#p3View .p3-pagination button:disabled{opacity:.4;cursor:not-allowed}
@media(max-width:800px){#p3View .p3-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){#p3View .p3-grid{grid-template-columns:1fr}#p3View .p3-actions button{flex:1}}
</style>
<section id="p3View" hidden>
 <div class="p3-head"><h1>OUTLETS</h1><p>Pencarian Customer Name dan tren bulanan berdasarkan Value atau Karton.</p></div>
 <div class="p3-card">
  <div class="p3-grid">
   <div><label for="p3SalesMode">JENIS SALES</label><select id="p3SalesMode"><option value="SOO">SOO</option><option value="SO">SO</option></select></div>
   <div><label for="p3Year">TAHUN ANALISIS</label><select id="p3Year"></select></div>
   <div><label>BULAN TERPILIH</label><div id="p3Months" class="p3-checks"></div></div>
   <div><label for="p3CustomerSearch">PENCARIAN CUSTOMER NAME</label><input id="p3CustomerSearch" type="search" placeholder="Ketik nama outlet..." autocomplete="off"></div>
   <div><label>METRIK</label><div id="p3MetricSwitch" class="p3-switch"><button type="button" class="active" data-metric="value">VALUE</button><button type="button" data-metric="carton">KARTON</button></div></div>
   <div><label>SUBDIST</label><div id="p3SubdistPills" class="p3-pills"></div></div>
   <div><label>SUBBRAND</label><div id="p3Subbrands" class="p3-checks"></div></div>
  </div>
  <div class="p3-actions"><button type="button" class="secondary" id="p3Reset">Reset</button><button type="button" id="p3Apply">Terapkan Filter</button></div>
 </div>
 <div id="p3Status" class="p3-status" aria-live="polite">Menyiapkan data outlet...</div>
 <div class="p3-summary"><div><small>JUMLAH OUTLET</small><b id="p3OutletCount">—</b></div><div><small>TOTAL VALUE</small><b id="p3TotalValue">—</b></div><div><small>TOTAL KARTON</small><b id="p3TotalCarton">—</b></div></div>
 <div class="p3-table"><div class="p3-table-head"><h2>TREND OUTLET BULANAN</h2><span id="p3TableInfo">—</span></div><div class="p3-scroll"><table id="p3TrendTable"><thead></thead><tbody></tbody></table></div>
  <div class="p3-pagination"><span id="p3PageInfo">—</span><div><button type="button" id="p3Prev">Sebelumnya</button> <button type="button" id="p3Next">Berikutnya</button></div></div>
 </div>
</section>
