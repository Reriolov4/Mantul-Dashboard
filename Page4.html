<style>
#p4View{padding:14px 0 28px;color:#172033;font-family:inherit}#p4View *{box-sizing:border-box}
#p4View .p4-head h1{font-size:21px;color:#173b70;margin:0 0 4px;font-weight:850}#p4View .p4-head p{font-size:11px;color:#718096;margin:0 0 12px}
#p4View .p4-card{background:#fff;border:1px solid #e5eaf1;border-radius:13px;padding:13px;margin-bottom:12px;box-shadow:0 3px 14px #14213d08}
#p4View .p4-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;align-items:start}
#p4View label{display:block;font-size:10px;font-weight:800;color:#64748b;margin:0 0 6px}
#p4View select{height:36px;width:100%;border:1px solid #dbe3ee;border-radius:8px;padding:0 9px;font:inherit;font-size:11px;background:#fff;color:#172033}
#p4View .p4-pills{display:flex;flex-wrap:wrap;gap:5px;max-height:120px;overflow:auto}
#p4View .p4-pills button{border:0;border-radius:18px;background:#f0f4f9;color:#53657c;padding:7px 11px;font-size:10px;font-weight:800;cursor:pointer}
#p4View .p4-pills button.active{background:#2563eb;color:white}
#p4View .p4-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:12px}
#p4View .p4-actions button{border:0;border-radius:8px;background:#2563eb;color:#fff;padding:8px 13px;font-size:10px;font-weight:800;cursor:pointer}
#p4View .p4-actions .secondary{background:#edf2f8;color:#365477}
#p4View .p4-status{font-size:10px;color:#718096;margin:7px 2px 10px;min-height:15px}
#p4View .p4-summary{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:11px}
#p4View .p4-summary div{background:#fff;border:1px solid #e5eaf1;border-radius:9px;padding:8px 12px;min-width:135px}
#p4View .p4-summary small{display:block;font-size:9px;color:#718096;font-weight:800}#p4View .p4-summary b{display:block;font-size:15px;color:#173b70;margin-top:3px}
#p4View .p4-table{background:#fff;border:1px solid #e5eaf1;border-radius:13px;overflow:hidden}
#p4View .p4-table-head{padding:12px 14px 8px;display:flex;justify-content:space-between;gap:8px;align-items:center}#p4View .p4-table-head h2{font-size:13px;color:#173b70;margin:0}#p4View .p4-table-head span{font-size:10px;color:#718096}
#p4View .p4-scroll{overflow:auto;max-height:650px;max-width:100%}#p4View table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:10px;white-space:nowrap}
#p4View th,#p4View td{padding:8px 9px;border-bottom:1px solid #e8edf5;text-align:right;min-width:90px}
#p4View thead th{position:sticky;top:0;background:#173b70;color:#fff;z-index:4}
#p4View th:first-child,#p4View td:first-child{position:sticky;left:0;text-align:left;min-width:230px;max-width:300px;overflow:hidden;text-overflow:ellipsis;z-index:5}
#p4View thead th:first-child{z-index:8}#p4View tbody td:first-child{background:#fff}
#p4View td:nth-child(2),#p4View th:nth-child(2),#p4View td:nth-child(3),#p4View th:nth-child(3){text-align:left;min-width:120px}
#p4View .p4-total td{background:#fff1cc;color:#173b70;font-weight:850;position:sticky;bottom:0;z-index:6}
@media(max-width:800px){#p4View .p4-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){#p4View .p4-grid{grid-template-columns:1fr}#p4View .p4-actions button{flex:1}}
</style>
<section id="p4View" hidden>
 <div class="p4-head"><h1>SKU KCH</h1><p>Monitoring SKU KCH berdasarkan Subdist dan periode tahun berjalan.</p></div>
 <div class="p4-card"><div class="p4-grid">
  <div><label for="p4Year">TAHUN ANALISIS</label><select id="p4Year"></select></div>
  <div><label>SUBDIST</label><div id="p4SubdistPills" class="p4-pills"></div></div>
 </div><div class="p4-actions"><button type="button" class="secondary" id="p4Reset">Reset</button><button type="button" id="p4Apply">Terapkan Filter</button></div></div>
 <div id="p4Status" class="p4-status" aria-live="polite">Menyiapkan data SKU KCH...</div>
 <div class="p4-summary"><div><small>SKU MASTER</small><b id="p4SkuCount">—</b></div><div><small>TOTAL VALUE</small><b id="p4TotalValue">—</b></div><div><small>TOTAL KARTON</small><b id="p4TotalCarton">—</b></div></div>
 <div class="p4-table"><div class="p4-table-head"><h2>DAFTAR SKU KCH</h2><span id="p4TableInfo">—</span></div><div class="p4-scroll"><table id="p4SkuTable"><thead></thead><tbody></tbody></table></div></div>
</section>
