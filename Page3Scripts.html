<script>
let p3Meta=null,p3Data=null,p3Metric='value',p3Subdist='ALL',p3InitBusy=false,p3Request=0;
const p3$=id=>document.getElementById(id),p3Num=v=>Number(v||0);
const p3Esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p3Fmt=v=>p3Num(v).toLocaleString('id-ID',{maximumFractionDigits:1});
const p3FmtValue=v=>p3Num(v).toLocaleString('id-ID',{maximumFractionDigits:0});
function p3Checked(id){return [...(p3$(id)?.querySelectorAll('input:checked')||[])].map(x=>x.value);}
function p3Busy(b){const el=p3$('p3View');if(el){if(b)el.setAttribute('aria-busy','true');else el.removeAttribute('aria-busy');}}
function p3RenderMonths(){const months=(p3Meta?.monthsByYear||{})[String(p3$('p3Year').value)]||[];p3$('p3Months').innerHTML=months.map(m=>'<label class="p3-check"><input type="checkbox" value="'+p3Esc(m)+'" checked> '+p3Esc(m)+'</label>').join('');}
function p3RenderSubdists(){const opts=['ALL',...(p3Meta?.subdists||[])];p3$('p3SubdistPills').innerHTML=opts.map(v=>'<button type="button" data-subdist="'+p3Esc(v)+'" class="'+(v===p3Subdist?'active':'')+'">'+(v==='ALL'?'SEMUA':p3Esc(v))+'</button>').join('');}
function p3RenderFilters(){p3$('p3Year').innerHTML=(p3Meta.years||[]).map(y=>'<option>'+p3Esc(y)+'</option>').join('');p3$('p3Year').value=(p3Meta.years||[]).includes('2026')?'2026':(p3Meta.years||[]).slice(-1)[0]||'';p3RenderMonths();p3RenderSubdists();p3$('p3Subbrands').innerHTML=(p3Meta.subbrands||[]).map(s=>'<label class="p3-check"><input type="checkbox" value="'+p3Esc(s)+'" checked> '+p3Esc(s)+'</label>').join('');}
function p3Filters(page){return {year:p3$('p3Year').value,months:p3Checked('p3Months'),customerName:p3$('p3CustomerSearch').value.trim(),subdists:p3Subdist==='ALL'?[]:[p3Subdist],subbrands:p3Checked('p3Subbrands'),metric:p3Metric,page:page||1,pageSize:50};}
function page3Init(){if(p3Meta||p3InitBusy)return;p3InitBusy=true;p3Busy(true);p3$('p3Status').textContent='Membaca indeks outlet...';google.script.run.withSuccessHandler(x=>{p3InitBusy=false;p3Busy(false);if(!x||!x.meta||!x.data){p3$('p3Status').textContent='Payload Page 3 tidak lengkap.';return;}p3Meta=x.meta;p3RenderFilters();p3Data=x.data;p3Render();p3$('p3Status').textContent='Sumber '+x.diagnostics.source+' • '+p3Fmt(p3Meta.sooRows)+' baris SOO';}).withFailureHandler(e=>{p3InitBusy=false;p3Busy(false);p3$('p3Status').textContent='Gagal memuat Page 3: '+(e.message||e);}).getPage3InitialPayload();}
function page3Apply(page){if(!p3Meta)return;const seq=++p3Request;p3Busy(true);p3$('p3Status').textContent='Menerapkan filter outlet...';google.script.run.withSuccessHandler(d=>{if(seq!==p3Request)return;p3Data=d;p3Render();p3$('p3Status').textContent=p3Fmt(d.totalRows)+' outlet • '+p3Fmt(d.matchedSourceRows)+' baris transaksi';p3Busy(false);}).withFailureHandler(e=>{if(seq!==p3Request)return;p3Busy(false);p3$('p3Status').textContent='Gagal menerapkan filter: '+(e.message||e);}).getPage3OutletData(p3Filters(page||1));}
function p3Render(){if(!p3Data)return;const d=p3Data,months=d.months||[],rows=d.rows||[],fmt=p3Metric==='value'?p3FmtValue:p3Fmt;p3$('p3OutletCount').textContent=p3Fmt(d.totalRows);p3$('p3TotalValue').textContent=p3FmtValue(d.totals.value);p3$('p3TotalCarton').textContent=p3Fmt(d.totals.carton);p3$('p3TableInfo').textContent=d.year+' • '+months.join(', ');const t=p3$('p3TrendTable');t.querySelector('thead').innerHTML='<tr><th>CUSTOMER NAME</th><th>SUBDIST</th>'+months.map(m=>'<th>'+p3Esc(m)+'</th>').join('')+'<th>TOTAL</th></tr>';t.querySelector('tbody').innerHTML=rows.map(r=>'<tr><td title="'+p3Esc(r.customerName)+'">'+p3Esc(r.customerName)+'</td><td>'+p3Esc(r.subdist)+'</td>'+months.map(m=>'<td>'+fmt(r.monthly?.[m]?.[p3Metric])+'</td>').join('')+'<td><b>'+fmt(r.total?.[p3Metric])+'</b></td></tr>').join('');if(d.monthTotals){t.querySelector('tbody').insertAdjacentHTML('beforeend','<tr class="p3-total"><td>GRAND TOTAL</td><td></td>'+months.map(m=>'<td>'+fmt(d.monthTotals[m]?.[p3Metric])+'</td>').join('')+'<td>'+fmt(d.totals[p3Metric])+'</td></tr>');}const pages=Math.max(1,Math.ceil(d.totalRows/(d.pageSize||50)));p3$('p3PageInfo').textContent='Halaman '+d.page+' dari '+pages+' • '+p3Fmt(d.totalRows)+' outlet';p3$('p3Prev').disabled=d.page<=1;p3$('p3Next').disabled=d.page>=pages;document.querySelectorAll('#p3MetricSwitch button').forEach(b=>b.classList.toggle('active',b.dataset.metric===p3Metric));}
function page3Reset(){if(!p3Meta)return;p3$('p3Year').value=p3Meta.years.includes('2026')?'2026':p3Meta.years.slice(-1)[0];p3$('p3CustomerSearch').value='';p3Subdist='ALL';p3Metric='value';p3RenderMonths();p3RenderSubdists();p3$('p3Subbrands').querySelectorAll('input').forEach(x=>x.checked=true);page3Apply(1);}
function page3Show(){mantulShowPage_('p3View');if(!p3Meta)page3Init();}
document.addEventListener('click',e=>{const sd=e.target.closest('#p3SubdistPills button');if(sd){p3Subdist=sd.dataset.subdist;p3RenderSubdists();page3Apply(1);}const metric=e.target.closest('#p3MetricSwitch button');if(metric&&metric.dataset.metric!==p3Metric){p3Metric=metric.dataset.metric;page3Apply(1);}if(e.target.id==='p3Apply')page3Apply(1);if(e.target.id==='p3Reset')page3Reset();if(e.target.id==='p3Prev'&&!e.target.disabled)page3Apply(Math.max(1,(p3Data?.page||1)-1));if(e.target.id==='p3Next'&&!e.target.disabled)page3Apply((p3Data?.page||1)+1);});
p3$('p3Year')?.addEventListener('change',()=>{p3RenderMonths();page3Apply(1);});p3$('p3CustomerSearch')?.addEventListener('keydown',e=>{if(e.key==='Enter')page3Apply(1);});
</script>
