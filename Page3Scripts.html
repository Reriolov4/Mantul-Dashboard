const p3CenterText={id:'p3CenterText',afterDraw(chart){if(chart.config.type!=='doughnut')return;const total=(chart.data.datasets[0]?.data||[]).reduce((a,b)=>a+Number(b||0),0);const ctx=chart.ctx,area=chart.chartArea;if(!area)return;ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#64748b';ctx.font='600 10px Inter, Segoe UI, Arial, sans-serif';ctx.fillText(p3MetricValue==='ao'?'TOTAL AO':p3MetricValue==='ec'?'TOTAL EC':'TOTAL VALUE', (area.left+area.right)/2,(area.top+area.bottom)/2-9);ctx.fillStyle='#172b4d';ctx.font='800 19px Inter, Segoe UI, Arial, sans-serif';ctx.fillText(p3FmtMetric(total),(area.left+area.right)/2,(area.top+area.bottom)/2+11);ctx.restore();}};

function p3Chart(id,type,data,options){if(p3Charts[id])p3Charts[id].destroy();const ctx=p3$(id);const defaults={responsive:true,maintainAspectRatio:false,font:{family:'Inter, Segoe UI, Arial, sans-serif'},plugins:{legend:{display:type!=='doughnut',position:'bottom',labels:{boxWidth:10,font:{size:9}}}},scales:type==='doughnut'?{}:{y:{beginAtZero:true,grid:{display:false,drawBorder:false},ticks:{font:{size:9}}},x:{grid:{display:false,drawBorder:false},ticks:{font:{size:9},maxRotation:0,minRotation:0}}}};p3Charts[id]=new Chart(ctx,{type,data,options:Object.assign(defaults,options||{}),plugins:type==='doughnut'?[p3CenterText]:[p3ValueLabels]});}
function p3RenderDonut(key,canvasId,legendId){

function page3RenderChartInsights(){
 const d=p3Data,k=d.kpi,metric=p3MetricValue,order=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
 const lastIndex=order.indexOf(k.mtdMonth),ytdMonths=lastIndex>=0?order.slice(0,lastIndex+1):[];
