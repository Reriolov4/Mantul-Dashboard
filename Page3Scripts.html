<script>
let p3Meta=null,p3Data=null,p3InitBusy=false,p3Request=0,p3Subdist='SEMUA';
const p3$=id=>document.getElementById(id),p3Num=v=>Number(v||0),p3Esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p3Fmt=v=>p3Num(v).toLocaleString('id-ID',{maximumFractionDigits:1}),p3FmtValue=v=>p3Num(v).toLocaleString('id-ID',{maximumFractionDigits:0});
const p3Ids=['p3Months','p3Dates','p3Pics','p3Brands','p3Subbrands','p3Categories','p3Customers'];
function p3Selected(id){return [...(p3$(id)?.querySelectorAll('input:checked')||[])].map(x=>x.value)}
function p3SelectedFilter(id){const a=p3Selected(id),n=p3$(id)?.querySelectorAll('input').length||0;return !a.length||a.length===n?[]:a}
function p3Fill(id,values){const box=p3$(id);if(!box)return;box.innerHTML=(values||[]).map(v=>'<label class="p3-checkitem"><input type="checkbox" value="'+p3Esc(v)+'" checked><span>'+p3Esc(v)+'</span></label>').join('')}
function p3UpdateTrigger(id){const n=p3$(id)?.querySelectorAll('input').length||0,s=p3Selected(id),label={p3Months:'Bulan',p3Dates:'Tanggal',p3Pics:'PIC',p3Brands:'Brand',p3Subbrands:'Subbrand',p3Categories:'Category',p3Customers:'Customer'}[id];p3$(id+'Trigger').textContent=s.length===n||!s.length?'Semua '+label:s.length===1?s[0]:s.length+' dipilih'}
function p3RenderSubdist(){const b=p3$('p3SubdistPills');b.innerHTML=['SEMUA',...(p3Meta?.subdists||[])].map(v=>'<button type="button" data-subdist="'+p3Esc(v)+'" class="'+(p3Subdist===v?'active':'')+'">'+p3Esc(v)+'</button>').join('')}
function p3SetDateDefaults(){const year=String(p3$('p3Year')?.value||''),months=p3Selected('p3Months'),order=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'],keys=(p3Meta?.dateKeys||[]).filter(k=>k.startsWith(year+'-')&&(!months.length||months.includes(order[Number(k.slice(5,7))-1]))),maxDay=keys.length?Math.max(...keys.map(k=>Number(k.slice(8,10)))):0,box=p3$('p3Dates');box.innerHTML='';for(let d=1;d<=31;d++){const v=String(d).padStart(2,'0');box.insertAdjacentHTML('beforeend','<label class=\"p3-checkitem\"><input type=\"checkbox\" value=\"'+v+'\" '+(d<=maxDay?'checked':'')+'><span>'+v+'</span></label>')}}
function p3RenderFilters(){p3$('p3Year').innerHTML=(p3Meta.years||[]).map(y=>'<option>'+p3Esc(y)+'</option>').join('');p3$('p3Year').value=(p3Meta.years||[]).includes('2026')?'2026':(p3Meta.years||[]).slice(-1)[0]||'';p3Fill('p3Months',(p3Meta.monthsByYear||{})[p3$('p3Year').value]||[]);p3SetDateDefaults();p3Fill('p3Pics',p3Meta.pics||[]);p3Fill('p3Brands',p3Meta.brands||[]);p3Fill('p3Subbrands',p3Meta.subbrands||[]);p3Fill('p3Categories',p3Meta.categories||[]);p3Fill('p3Customers',p3Meta.customers||[]);p3Ids.forEach(p3UpdateTrigger);p3RenderSubdist()}
function p3Filters(page){return {mode:p3$('p3SalesMode').value,year:p3$('p3Year').value,months:p3SelectedFilter('p3Months'),dates:p3SelectedFilter('p3Dates'),pics:p3SelectedFilter('p3Pics'),brands:p3SelectedFilter('p3Brands'),subbrands:p3SelectedFilter('p3Subbrands'),categories:p3SelectedFilter('p3Categories'),customers:p3SelectedFilter('p3Customers'),subdists:p3Subdist==='SEMUA'?[]:[p3Subdist],page:page||1,pageSize:50}}
function p3Busy(b){if(b)p3$('p3View').setAttribute('aria-busy','true');else p3$('p3View').removeAttribute('aria-busy')}
function page3Init(){if(p3Meta||p3InitBusy)return;p3InitBusy=true;p3Busy(true);google.script.run.withSuccessHandler(x=>{p3InitBusy=false;p3Busy(false);if(!x?.meta||!x?.data){p3$('p3Status').textContent='Payload Page 3 tidak lengkap.';return}p3Meta=x.meta;p3RenderFilters();p3Data=x.data;p3Render();p3$('p3Status').textContent='Sumber '+x.diagnostics.source+' • '+p3Fmt(p3Meta.sooRows)+' baris SOO • '+p3Fmt(p3Meta.soModeRows)+' baris untuk mode SO'}).withFailureHandler(e=>{p3InitBusy=false;p3Busy(false);p3$('p3Status').textContent='Gagal memuat Page 3: '+(e.message||e)}).getPage3InitialPayload('SOO')}
function page3Apply(page){if(!p3Meta)return;const seq=++p3Request;p3Busy(true);p3$('p3Status').textContent='Menerapkan filter...';google.script.run.withSuccessHandler(d=>{if(seq!==p3Request)return;p3Data=d;p3Render();p3$('p3Status').textContent=p3Fmt(d.totalRows)+' customer • '+p3Fmt(d.matchedSourceRows)+' baris transaksi '+d.mode+' • Jenis Sales: '+d.modeSalesType;p3Busy(false)}).withFailureHandler(e=>{if(seq!==p3Request)return;p3Busy(false);p3$('p3Status').textContent='Gagal menerapkan filter: '+(e.message||e)}).getPage3OutletData(p3Filters(page||1))}
function p3Render(){if(!p3Data)return;const d=p3Data,months=d.months||[],rows=d.rows||[];p3$('p3OutletCount').textContent=p3Fmt(d.totalRows);p3$('p3TotalValue').textContent=p3FmtValue(d.totals.value);p3$('p3TotalCarton').textContent=p3Fmt(d.totals.carton);p3$('p3TableInfo').textContent=d.mode+' • '+d.year+' • '+months.join(', ');const t=p3$('p3TrendTable');t.querySelector('thead').innerHTML='<tr><th>CUSTOMER NAME</th><th>SUBDIST</th>'+months.map(m=>'<th>'+p3Esc(m)+'</th>').join('')+'<th>TOTAL</th></tr>';t.querySelector('tbody').innerHTML=rows.map(r=>'<tr><td title="'+p3Esc(r.customerName)+'">'+p3Esc(r.customerName)+'</td><td>'+p3Esc(r.subdist)+'</td>'+months.map(m=>'<td>'+p3FmtValue(r.monthly?.[m]?.value)+'</td>').join('')+'<td><b>'+p3FmtValue(r.total.value)+'</b></td></tr>').join('')+'<tr class="p3-total"><td>GRAND TOTAL</td><td></td>'+months.map(m=>'<td>'+p3FmtValue(d.monthTotals[m]?.value)+'</td>').join('')+'<td>'+p3FmtValue(d.totals.value)+'</td></tr>';const pages=Math.max(1,Math.ceil(d.totalRows/(d.pageSize||50)));p3$('p3PageInfo').textContent='Halaman '+d.page+' dari '+pages+' • '+p3Fmt(d.totalRows)+' customer';p3$('p3Prev').disabled=d.page<=1;p3$('p3Next').disabled=d.page>=pages}
function page3Reset(){if(!p3Meta)return;p3$('p3SalesMode').value='SOO';p3$('p3Year').value=p3Meta.years.includes('2026')?'2026':p3Meta.years.slice(-1)[0];p3Subdist='SEMUA';p3RenderFilters();page3Apply(1)}
function page3Show(){mantulShowPage_('p3View');if(!p3Meta)page3Init()}
document.addEventListener('click',e=>{const f=e.target.closest('#p3View .p3-filter');if(e.target.matches('#p3View .p3-trigger')){document.querySelectorAll('#p3View .p3-filter.open').forEach(x=>{if(x!==f)x.classList.remove('open')});f.classList.toggle('open');return}if(e.target.closest('#p3View .p3-menu-actions [data-action]')){const b=e.target.closest('[data-action]'),a=b.dataset.action;if(a==='all'||a==='reset')p3$(b.dataset.target).querySelectorAll('input').forEach(x=>x.checked=a==='all');else if(a==='apply')f?.classList.remove('open');p3Ids.forEach(p3UpdateTrigger);return}const sd=e.target.closest('#p3SubdistPills button');if(sd){p3Subdist=sd.dataset.subdist;p3RenderSubdist();return}if(e.target.id==='p3Apply')page3Apply(1);if(e.target.id==='p3Reset')page3Reset();if(e.target.id==='p3Prev'&&!e.target.disabled)page3Apply(Math.max(1,(p3Data?.page||1)-1));if(e.target.id==='p3Next'&&!e.target.disabled)page3Apply((p3Data?.page||1)+1)})
document.addEventListener('change',e=>{if(e.target.closest('#p3View .p3-checklist'))p3Ids.forEach(p3UpdateTrigger);if(e.target.id==='p3Year'){p3Fill('p3Months',(p3Meta?.monthsByYear||{})[p3$('p3Year').value]||[]);p3UpdateTrigger('p3Months');p3SetDateDefaults();p3UpdateTrigger('p3Dates')}else if(e.target.closest('#p3Months')){p3SetDateDefaults();p3UpdateTrigger('p3Dates')}})
document.addEventListener('input',e=>{const id=e.target.dataset.search;if(id){const q=e.target.value.toLowerCase();p3$(id).querySelectorAll('.p3-checkitem').forEach(x=>x.hidden=!x.textContent.toLowerCase().includes(q))}})
p3$('p3SalesMode')?.addEventListener('change',()=>page3Apply(1));
</script>
