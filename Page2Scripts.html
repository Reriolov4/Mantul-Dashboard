<script>
let p2Data=null,p2Meta=null,p2Charts={},p2RequestSeq=0,p2MetricValue='ao';
let p2CustomerOptions=[],p2CustomerSelected=new Set();
const p2$=id=>document.getElementById(id);
const p2Fmt=v=>Number(v||0).toLocaleString('id-ID',{maximumFractionDigits:1});
const p2FmtValue=v=>{const n=Number(v||0),a=Math.abs(n),fmt=x=>x.toLocaleString('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2});if(a>=1e9)return fmt(n/1e9)+' M';if(a>=1e6)return fmt(n/1e6)+' Jt';if(a>=1e3)return fmt(n/1e3)+' Rb';return fmt(n);};
const p2FmtMetric=(v,metric=p2MetricValue)=>metric==='value'?p2FmtValue(v):p2Fmt(v);
const p2Esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function p2Selected(id){const el=p2$(id);if(!el)return [];if(el.tagName==='SELECT')return [...el.selectedOptions].map(o=>o.value);return [...el.querySelectorAll('input[type="checkbox"]:checked')].map(o=>o.value);}
function p2Fill(id,values,selectAll=true){const el=p2$(id);if(!el)return;const old=new Set(p2Selected(id));el.innerHTML='';(values||[]).forEach(v=>{const label=document.createElement('label');label.className='p2-checkitem';const cb=document.createElement('input');cb.type='checkbox';cb.value=String(v);cb.checked=selectAll||old.has(String(v));const text=document.createElement('span');text.textContent=String(v);label.append(cb,text);el.appendChild(label);});}
function p2FilterValues(){return {year:p2$('p2Year').value,months:p2Selected('p2Months'),dates:p2Selected('p2Dates'),pics:p2Selected('p2Pics'),subdists:p2Selected('p2Subdists'),brands:p2Selected('p2Brands'),subbrands:p2Selected('p2Subbrands'),categories:p2Selected('p2Categories'),customers:[...p2CustomerSelected]};}
function p2UpdateTrigger(id,triggerId,allText){const selected=p2Selected(id),el=p2$(triggerId);if(!el)return;const total=p2$(id)?.querySelectorAll('input[type="checkbox"]').length||0;el.textContent=selected.length===total||selected.length===0?allText:selected.length===1?selected[0]:selected.length+' dipilih';}
function p2UpdateCustomerTrigger(){const el=p2$('p2CustomerTrigger');if(el)el.textContent=p2CustomerSelected.size?p2CustomerSelected.size.toLocaleString('id-ID')+' outlet dipilih':'Pilih Outlet';const count=p2$('p2CustomerCount');if(count)count.textContent=p2CustomerSelected.size?p2CustomerSelected.size.toLocaleString('id-ID')+' outlet dipilih':'Tidak ada pilihan = semua outlet';}
function p2RenderCustomerList(){const box=p2$('p2CustomerList');if(!box)return;const q=String(p2$('p2CustomerSearch')?.value||'').trim().toLocaleLowerCase('id');const matches=p2CustomerOptions.filter(v=>!q||v.toLocaleLowerCase('id').includes(q));box.innerHTML='';matches.slice(0,120).forEach(v=>{const label=document.createElement('label');label.className='p2-checkitem';const cb=document.createElement('input');cb.type='checkbox';cb.value=v;cb.checked=p2CustomerSelected.has(v);const span=document.createElement('span');span.textContent=v;label.append(cb,span);box.appendChild(label);});const count=p2$('p2CustomerCount');if(count)count.textContent=matches.length.toLocaleString('id-ID')+' outlet ditemukan'+(matches.length>120?' • tampil 120 pertama':'');p2UpdateCustomerTrigger();}
function p2UpdateTriggers(){p2UpdateCustomerTrigger();p2UpdateTrigger('p2Months','p2MonthsTrigger','Semua Bulan');p2UpdateTrigger('p2Pics','p2PicsTrigger','Semua PIC');p2UpdateTrigger('p2Subdists','p2SubdistsTrigger','Semua Subdist');p2UpdateTrigger('p2Brands','p2BrandsTrigger','Semua Brand');p2UpdateTrigger('p2Subbrands','p2SubbrandsTrigger','Semua Subbrand');p2UpdateTrigger('p2Categories','p2CategoriesTrigger','Semua Category');p2UpdateTrigger('p2Dates','p2DatesTrigger','Semua Tanggal');const months=p2Selected('p2Months'),total=p2$('p2Months')?.querySelectorAll('input[type="checkbox"]').length||0;p2$('p2MonthsTrigger').textContent=!months.length?'Tidak ada bulan dipilih':months.length===total?'Semua Bulan':months.length===1?months[0]:months.length+' bulan dipilih';}
function p2SetYtdMonths(){const year=p2$('p2Year')?.value,available=(p2Meta?.monthsByYear||{})[String(year)]||[];const order=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];let last=-1;available.forEach(m=>{const i=order.indexOf(m);if(i>last)last=i;});const selected=new Set(order.slice(0,last+1));p2$('p2Months')?.querySelectorAll('input[type="checkbox"]').forEach(x=>x.checked=selected.has(x.value));p2SetDateDefaults();p2UpdateTriggers();}
function p2SetDateDefaults(){const box=p2$('p2Dates');if(!box)return;const year=String(p2$('p2Year')?.value||''),months=p2Selected('p2Months'),order=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];const days=(p2Meta?.dateKeys||[]).filter(k=>k.startsWith(year+'-')&&(!months.length||months.includes(order[Number(k.slice(5,7))-1]))).map(k=>Number(k.slice(8,10)));const maxDay=days.length?Math.max(...days):new Date().getDate();box.innerHTML='';for(let d=1;d<=31;d++){const v=String(d).padStart(2,'0'),label=document.createElement('label');label.className='p2-checkitem';const cb=document.createElement('input');cb.type='checkbox';cb.value=v;cb.checked=d<=maxDay;const span=document.createElement('span');span.textContent=v;label.append(cb,span);box.appendChild(label);}}
function p2SelectAll(id){p2$(id)?.querySelectorAll('input[type="checkbox"]').forEach(x=>x.checked=true);p2UpdateTriggers();}
function p2Clear(id){p2$(id)?.querySelectorAll('input[type="checkbox"]').forEach(x=>x.checked=false);p2UpdateTriggers();}
function p2ResetFilter(id){p2Clear(id);}
function p2CloseMenus(){document.querySelectorAll('#page2View .p2-filter.open').forEach(x=>x.classList.remove('open'));p2UpdateTriggers();}
function p2SetBusy_(busy,label){
 const view=p2$('page2View');if(!view)return;
 if(busy){view.setAttribute('aria-busy','true');const t=p2$('p2LoadingText');if(t)t.textContent=label||'Sedang memproses data Page 2...';}
 else view.removeAttribute('aria-busy');
}
function p2SetLoadingState_(label){
 document.querySelectorAll('#page2View .k-main, #page2View .p2-sbu-values b, #page2View .k-growth').forEach(el=>{el.textContent=label;});
}
function page2Init(){
 const view=p2$('page2View'),status=p2$('p2Status');
 p2SetBusy_(true,'Mengambil data dan menyusun KPI Page 2...');
 if(status){status.setAttribute('aria-live','polite');status.textContent='Memuat metadata, KPI, dan grafik dari RAW_DATA_SALES...';}
 if(!p2Data)p2SetLoadingState_('Memuat…');
 if(!window.google||!google.script||!google.script.run){
  if(status)status.textContent='Buka dashboard melalui Google Apps Script Web App.';
  if(!p2Data)p2SetLoadingState_('Tidak tersedia');
  p2SetBusy_(false);
  return;
 }
 google.script.run.withSuccessHandler(payload=>{
  try {
  if(!payload || !payload.meta || !payload.data) throw new Error('Server tidak mengirim metadata dan data awal Page 2.');
  const meta=payload.meta,data=payload.data;
  p2Meta=meta;
  const year=p2$('p2Year'),page1Year=p2$('year');
  year.innerHTML='';
  if(page1Year && page1Year.options.length){
   [...page1Year.options].forEach(source=>{
    const option=document.createElement('option');
    option.value=source.value;option.textContent=source.textContent;
    year.appendChild(option);
   });
   year.value=page1Year.value;
  }else{
   (meta.years||[]).forEach(y=>{const option=document.createElement('option');option.value=y;option.textContent=y;year.appendChild(option);});
   year.value=(meta.years||[]).includes('2026')?'2026':((meta.years||[]).slice(-1)[0]||'');
  }
  p2Fill('p2Months',meta.months||[],false);
  p2Fill('p2Pics',meta.pics||[]);
  p2Fill('p2Subdists',meta.subdists||[]);
  p2Fill('p2Brands',meta.brands||[]);
  p2Fill('p2Subbrands',meta.subbrands||[]);
  p2Fill('p2Categories',meta.categories||[]);
  p2CustomerOptions=(meta.accounts||[]).slice().sort((a,b)=>a.localeCompare(b,'id'));
  p2CustomerSelected.clear();
  p2RenderCustomerList();
  p2SetYtdMonths();
  p2SetDateDefaults();
  p2UpdateTriggers();
  if(!data){p2SetBusy_(false);p2$('p2Status').textContent='Respons awal Page 2 tidak berisi data dashboard.';p2SetLoadingState_('Gagal memuat');return;}
  // Jika tahun Page 1 berbeda dari payload awal server, ambil ulang
  // menggunakan tahun yang benar-benar tampil pada filter Page 2.
  if(Number(year.value)!==Number(data.kpi.year)){
   p2Data=null;
   page2Apply();
   return;
  }
  p2Data=data;
  page2Render();
  p2SetBusy_(false);
  const diag=payload.diagnostics||{};
  const timing=diag.cacheHit?'Cache awal aktif • '+(diag.totalMs||0)+' ms':
   'Server '+(diag.totalMs||0)+' ms (baca '+(diag.readMs||0)+' • metadata '+(diag.metaMs||0)+' • agregasi '+(diag.aggregateMs||0)+' ms)';
  p2$('p2Status').textContent=`${p2Fmt(data.kpi.rows)} baris SOO terpilih • Sumber RAW_DATA_SALES: ${p2Fmt(meta.sourceRowCount||0)} baris (SOO: ${p2Fmt(meta.sooRowCount||0)}) • Tahun ${data.kpi.year} • ${data.updatedAt||'Live Google Sheets'} • ${timing}`;
  } catch(err) {
   if(view)view.removeAttribute('aria-busy');
   p2$('p2Status').textContent='Kesalahan tampilan Page 2: '+(err.message||String(err));
   p2SetLoadingState_('Gagal memuat');
   console.error(err);
  }
 }).withFailureHandler(e=>{
  if(view)view.removeAttribute('aria-busy');
  p2$('p2Status').textContent='Gagal memuat Halaman 2: '+(e.message||String(e));
  if(!p2Data)p2SetLoadingState_('Gagal memuat');
 }).getPage2InitialPayload();
}
document.addEventListener('click',e=>{const action=e.target.closest('#page2View [data-p2-action]');if(action){e.preventDefault();e.stopPropagation();const act=action.dataset.p2Action,target=action.dataset.p2Target;if(act==='all')p2SelectAll(target);else if(act==='reset')p2ResetFilter(target);else if(act==='ytd')p2SetYtdMonths();else if(act==='customer-all'){p2CustomerSelected=new Set(p2CustomerOptions);p2RenderCustomerList();}else if(act==='customer-reset'){p2CustomerSelected.clear();p2RenderCustomerList();}else if(act==='customer-apply'){p2CloseMenus();page2Apply();}else if(act==='apply'){p2CloseMenus();page2Apply();}return;}const trigger=e.target.closest('#page2View .p2-trigger');if(trigger){const filter=trigger.closest('.p2-filter');const wasOpen=filter.classList.contains('open');p2CloseMenus();if(!wasOpen)filter.classList.add('open');return;}if(!e.target.closest('#page2View .p2-menu'))p2CloseMenus();});
document.addEventListener('change',e=>{if(e.target?.closest('#page2View .p2-checklist')){if(e.target.closest('#p2CustomerList')){if(e.target.checked)p2CustomerSelected.add(e.target.value);else p2CustomerSelected.delete(e.target.value);p2UpdateCustomerTrigger();}else{p2UpdateTriggers();if(e.target?.closest('#p2Months'))p2SetDateDefaults();}}if(e.target?.id==='p2Year'){p2SetYtdMonths();if(p2Meta)page2Apply();}});
document.addEventListener('input',e=>{
 if(e.target?.id==='p2CustomerSearch'){p2RenderCustomerList();return;}
 const search=e.target?.closest('[data-p2-search]');
 if(!search)return;
 const target=p2$(search.dataset.p2Search);
 const query=String(search.value||'').trim().toLocaleLowerCase('id');
 target?.querySelectorAll('.p2-checkitem').forEach(item=>{
  item.style.display=!query||item.textContent.toLocaleLowerCase('id').includes(query)?'':'none';
 });
});
function page2Apply(){
 if(!p2Meta)return;
 const requestId=++p2RequestSeq;
 const requestStarted=Date.now();
 const view=p2$('page2View'),status=p2$('p2Status');
 p2SetBusy_(true,'Menerapkan filter dan menghitung ulang KPI...');
 if(status){status.setAttribute('aria-live','polite');status.textContent='Memuat KPI dan grafik SOO dari RAW_DATA_SALES...';}
 if(!p2Data)p2SetLoadingState_('Memuat…');
 const f=p2FilterValues();
 google.script.run.withSuccessHandler(d=>{
  // Abaikan hasil request lama jika pengguna sudah menerapkan filter baru.
  if(requestId!==p2RequestSeq)return;
  p2Data=d;page2Render();
  if(view)view.removeAttribute('aria-busy');
  p2$('p2Status').textContent=`${p2Fmt(d.kpi.rows)} baris SOO terpilih • Tahun ${d.kpi.year} • ${d.updatedAt||'Live Google Sheets'} • Respon filter ${((Date.now()-requestStarted)/1000).toFixed(1)} detik`;
 }).withFailureHandler(e=>{
  if(requestId!==p2RequestSeq)return;
  if(view)view.removeAttribute('aria-busy');
  p2$('p2Status').textContent='Gagal memuat data: '+(e.message||String(e));
  if(!p2Data)p2SetLoadingState_('Gagal memuat');
 }).getPage2DashboardData(f);
}
function page2Reset(){if(!p2Meta)return;p2$('p2Year').value=(p2Meta.years||[]).includes('2026')?'2026':(p2Meta.years||[]).slice(-1)[0];p2SetYtdMonths();['p2Pics','p2Subdists','p2Brands','p2Subbrands','p2Categories'].forEach(p2SelectAll);p2SetDateDefaults();p2CustomerSelected.clear();p2RenderCustomerList();if(p2$('p2MetricSwitch'))page2SetMetric('ao');p2CloseMenus();page2Apply();}
function p2Growth(v){if(v===null||v===undefined)return '—';return (v>0?'+':'')+Number(v).toFixed(1)+'%';}
function p2SetGrowth(id,v){const el=p2$(id);el.textContent=p2Growth(v);el.className='k-growth '+(v===null||!Number.isFinite(Number(v))?'p2-neutral':v>0?'p2-positive':v<0?'p2-negative':'p2-neutral');}
function p2IndicatorClass(v){if(v===null||v===undefined||!Number.isFinite(Number(v)))return 'p2-neutral';return v>0?'p2-positive':v<0?'p2-negative':'p2-neutral';}
function p2CtrClass(v){if(v===null||v===undefined||!Number.isFinite(Number(v)))return 'p2-ctr-neutral';return v>=25?'p2-ctr-blue':v>=10?'p2-ctr-darkgreen':v>=5?'p2-ctr-lightgreen':v>=3?'p2-ctr-orange':'p2-ctr-red';}
function p2SetIndicator(id,v,kind){const el=p2$(id);el.className=kind==='ctr'?'k-ctr '+p2CtrClass(v):p2IndicatorClass(v);}
function p2SetText(id,v){p2$(id).textContent=v;}
function page2RenderPareto(){
 const body=p2$('p2ParetoBody');if(!body)return;
 const rows=p2Data?.pareto||[];
 if(!rows.length){body.innerHTML='<tr><td colspan="12" class="p2-empty">Tidak ada outlet pada filter terpilih.</td></tr>';return;}
 const money=v=>Number(v||0).toLocaleString('id-ID',{maximumFractionDigits:0});
 const growth=v=>v===null||v===undefined?'—':(v>0?'+':'')+Number(v).toFixed(1)+'%';
 const cls=v=>v===null||v===undefined?'p2-neutral':v>0?'p2-positive':v<0?'p2-negative':'p2-neutral';
 body.innerHTML=rows.map(r=>'<tr>'+
  '<td>'+p2Esc(r.customerName)+'</td><td>'+p2Esc(r.subdist)+'</td>'+
  '<td>'+money(r.actualCY)+'</td><td>'+money(r.actualLY)+'</td><td class="'+cls(r.grwMTD)+'">'+growth(r.grwMTD)+'</td>'+
  '<td><b>'+money(r.actualYTD)+'</b></td><td>'+money(r.actualLYYTD)+'</td><td class="'+cls(r.grwYTD)+'">'+growth(r.grwYTD)+'</td>'+
  '<td class="'+cls(r.grwVsLM)+'">'+growth(r.grwVsLM)+'</td><td class="'+cls(r.grwVsL3M)+'">'+growth(r.grwVsL3M)+'</td>'+
  '<td class="'+p2CtrClass(Number(r.ctr||0))+'">'+Number(r.ctr||0).toFixed(1)+'%</td><td>'+(r.avgMonth===null?'—':money(r.avgMonth))+'</td></tr>').join('');
 const sum=key=>rows.reduce((total,r)=>total+(Number(r[key])||0),0);
 const totalCY=sum('actualCY'),totalLY=sum('actualLY'),totalYTD=sum('actualYTD'),totalLYYTD=sum('actualLYYTD');
 const totalPrevious=sum('previousValue'),totalAverage3=sum('averageLast3Value');
 const totalCTR=sum('ctr'),totalAverageMonth=sum('avgMonth');
 body.insertAdjacentHTML('beforeend','<tr class="p2-grand-total"><td><b>GRAND TOTAL (25 OUTLET)</b></td><td>—</td>'+
  '<td><b>'+money(totalCY)+'</b></td><td><b>'+money(totalLY)+'</b></td><td class="'+cls(totalLY?(totalCY/totalLY-1)*100:null)+'">'+growth(totalLY?(totalCY/totalLY-1)*100:null)+'</td>'+
  '<td><b>'+money(totalYTD)+'</b></td><td><b>'+money(totalLYYTD)+'</b></td><td class="'+cls(totalLYYTD?(totalYTD/totalLYYTD-1)*100:null)+'">'+growth(totalLYYTD?(totalYTD/totalLYYTD-1)*100:null)+'</td>'+
  '<td class="'+cls(totalPrevious?(totalCY/totalPrevious-1)*100:null)+'">'+growth(totalPrevious?(totalCY/totalPrevious-1)*100:null)+'</td>'+
  '<td class="'+cls(totalAverage3?(totalCY/totalAverage3-1)*100:null)+'">'+growth(totalAverage3?(totalCY/totalAverage3-1)*100:null)+'</td>'+
  '<td class="'+p2CtrClass(totalCTR)+'"><b>'+totalCTR.toFixed(1)+'%</b></td><td><b>'+money(totalAverageMonth)+'</b></td></tr>');
}
function page2RenderParetoTrend(){
 const head=p2$('p2ParetoTrendHead'),body=p2$('p2ParetoTrendBody');
 if(!head||!body)return;
 const rows=p2Data?.pareto||[],months=(p2Data?.kpi?.trendMonths||p2Data?.kpi?.months||[]).slice();
 const monthLabels={JAN:'Jan',FEB:'Feb',MAR:'Mar',APR:'Apr',MAY:'May',JUN:'Jun',JUL:'Jul',AUG:'Aug',SEP:'Sep',OCT:'Oct',NOV:'Nov',DEC:'Dec'};
 const fmt=v=>Number(v||0).toLocaleString('id-ID',{maximumFractionDigits:0});
 const growth=v=>v===null||v===undefined?'—':(v>0?'+':'')+Number(v).toFixed(1)+'%';
 const cls=v=>v===null||v===undefined?'p2-neutral':v>0?'p2-positive':v<0?'p2-negative':'p2-neutral';
 const cols=['CUSTOMER NAME','SUBDIST',...months.map(m=>monthLabels[m]||m),'ACTUAL YTD','ACTUAL LY YTD','GRW YTD','GRW VS LM','GRW VS L3M','CTR','AVG / MONTH'];
 const colClass=i=>i>=2+months.length&&i<2+months.length+5?'p2-col-growth':i===2+months.length+6?'p2-col-growth-long':''; 
 head.innerHTML='<tr>'+cols.map((x,i)=>'<th class="'+colClass(i)+'">'+p2Esc(x)+'</th>').join('')+'</tr>';
 if(!rows.length){body.innerHTML='<tr><td colspan="'+cols.length+'" class="p2-empty">Tidak ada outlet Pareto pada filter terpilih.</td></tr>';return;}
 const totalCY=rows.reduce((a,r)=>a+(Number(r.actualYTD)||0),0);
 const totalLY=rows.reduce((a,r)=>a+(Number(r.actualLYYTD)||0),0);
 const totalPrev=rows.reduce((a,r)=>a+(Number(r.previousValue)||0),0);
 const totalAvg3=rows.reduce((a,r)=>a+(Number(r.averageLast3Value)||0),0);
 const totalAvgMonth=rows.reduce((a,r)=>a+(Number(r.avgMonth)||0),0);
 const monthTotals=months.map(m=>rows.reduce((a,r)=>a+(Number(r.monthValues?.[m])||0),0));
 body.innerHTML=rows.map(r=>{
  const tds=[ '<td>'+p2Esc(r.customerName)+'</td>','<td>'+p2Esc(r.subdist)+'</td>' ];
  months.forEach(m=>tds.push('<td>'+fmt(r.monthValues?.[m])+'</td>'));
  tds.push('<td><b>'+fmt(r.actualYTD)+'</b></td>','<td>'+fmt(r.actualLYYTD)+'</td>','<td class="'+colClass(2+months.length)+' '+cls(r.grwYTD)+'">'+growth(r.grwYTD)+'</td>','<td class="'+colClass(3+months.length)+' '+cls(r.grwVsLM)+'">'+growth(r.grwVsLM)+'</td>','<td class="'+colClass(4+months.length)+' '+cls(r.grwVsL3M)+'">'+growth(r.grwVsL3M)+'</td>','<td class="'+colClass(5+months.length)+' '+p2CtrClass(totalCY?r.actualYTD/totalCY*100:0)+'">'+(totalCY?(r.actualYTD/totalCY*100):0).toFixed(1)+'%</td>','<td>'+(r.avgMonth===null?'—':fmt(r.avgMonth))+'</td>');
  return '<tr>'+tds.join('')+'</tr>';
 }).join('');
 const totalCtr=100;
 const totalGrw=totalLY?(totalCY/totalLY-1)*100:null;
 const totalPrevGrw=totalPrev?(totalCY/totalPrev-1)*100:null;
 const total3Grw=totalAvg3?(totalCY/totalAvg3-1)*100:null;
 const totalCells=['<td><b>GRAND TOTAL (25 OUTLET)</b></td>','<td>—</td>',...monthTotals.map(v=>'<td><b>'+fmt(v)+'</b></td>'),'<td><b>'+fmt(totalCY)+'</b></td>','<td><b>'+fmt(totalLY)+'</b></td>','<td class="'+colClass(2+months.length)+' '+cls(totalGrw)+'">'+growth(totalGrw)+'</td>','<td class="'+colClass(3+months.length)+' '+cls(totalPrevGrw)+'">'+growth(totalPrevGrw)+'</td>','<td class="'+colClass(4+months.length)+' '+cls(total3Grw)+'">'+growth(total3Grw)+'</td>','<td class="'+colClass(5+months.length)+' p2-ctr-blue"><b>'+totalCtr.toFixed(1)+'%</b></td>','<td><b>'+fmt(totalAvgMonth)+'</b></td>'];
 body.insertAdjacentHTML('beforeend','<tr class="p2-grand-total">'+totalCells.join('')+'</tr>');
}
function page2Render(){
 if(!p2Data)return;const d=p2Data,k=d.kpi;
 p2SetText('p2AO',p2Fmt(k.ao));p2SetText('p2AOdesc',`Outlet unik ${k.year} • ${k.monthCount} bulan`);p2SetText('p2AOly',`AO LY (${k.ly}): ${p2Fmt(k.aoLy)}`);p2SetGrowth('p2AOgrowth',k.aoGrowth);p2$('p2AOgrowth').textContent='GRW '+p2Growth(k.aoGrowth);
 p2SetText('p2EC',p2Fmt(k.ec));p2SetText('p2ECdesc',`Aktivitas outlet ${k.year} • ${k.monthCount} bulan`);p2SetText('p2ECly',`EC LY (${k.ly}): ${p2Fmt(k.ecLy)}`);p2SetGrowth('p2ECgrowth',k.ecGrowth);p2$('p2ECgrowth').textContent='GRW '+p2Growth(k.ecGrowth);
 const aoMtdGrw=k.aoMTDLY?(k.aoMTD/k.aoMTDLY-1)*100:(k.aoMTD?null:0);
 const ecMtdGrw=k.ecMTDLY?(k.ecMTD/k.ecMTDLY-1)*100:(k.ecMTD?null:0);
 p2SetText('p2AOMTD',p2Fmt(k.aoMTD));p2SetText('p2AOMTDdesc','AO '+k.mtdMonth+' '+k.year);p2SetGrowth('p2AOMTDgrowth',aoMtdGrw);p2$('p2AOMTDgrowth').textContent='GRW MTD '+p2Growth(aoMtdGrw);p2SetText('p2AOMTDLY',`AO LY (${k.ly}): ${p2Fmt(k.aoMTDLY)}`);
 p2SetText('p2ECMTD',p2Fmt(k.ecMTD));p2SetText('p2ECMTDdesc','EC '+k.mtdMonth+' '+k.year);p2SetGrowth('p2ECMTDgrowth',ecMtdGrw);p2$('p2ECMTDgrowth').textContent='GRW MTD '+p2Growth(ecMtdGrw);p2SetText('p2ECMTDLY',`EC LY (${k.ly}): ${p2Fmt(k.ecMTDLY)}`);
 [['B7','b7'],['SAKA','saka']].forEach(([label,key])=>{const x=d.sbu[key];p2SetText('p2'+label,p2Fmt(x.aoCY));p2SetText('p2'+label+'desc',`Outlet unik ${k.year} • ${k.monthCount} bulan`);p2SetText('p2'+label+'LY',`AO LY (${k.ly}): ${p2Fmt(x.aoLY)}`);p2SetText('p2'+label+'GRW','GRW '+p2Growth(x.growth));p2SetGrowth('p2'+label+'GRW',x.growth);});
 page2DrawCharts();
 page2RenderPareto();
 page2RenderParetoTrend();
}
const p2Palette=['#284b8f','#2f7775','#2f7139','#b87525','#76508d','#b23d42','#5986b7','#9b9b54','#5b6472','#c16d55'];
const p2CenterText={id:'p2CenterText',afterDraw(chart){if(chart.config.type!=='doughnut')return;const total=(chart.data.datasets[0]?.data||[]).reduce((a,b)=>a+Number(b||0),0);const ctx=chart.ctx,area=chart.chartArea;if(!area)return;ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#64748b';ctx.font='600 10px Inter, Segoe UI, Arial, sans-serif';ctx.fillText(p2MetricValue==='ao'?'TOTAL AO':p2MetricValue==='ec'?'TOTAL EC':'TOTAL VALUE', (area.left+area.right)/2,(area.top+area.bottom)/2-9);ctx.fillStyle='#172b4d';ctx.font='800 19px Inter, Segoe UI, Arial, sans-serif';ctx.fillText(p2FmtMetric(total),(area.left+area.right)/2,(area.top+area.bottom)/2+11);ctx.restore();}};
const p2ValueLabels={id:'p2ValueLabels',afterDatasetsDraw(chart,args,opts){if(!opts||!opts.enabled||chart.config.type==='doughnut')return;const ctx=chart.ctx,area=chart.chartArea;if(!area)return;const compact=area.right-area.left<850;ctx.save();ctx.font='700 8px Inter, Segoe UI, Arial, sans-serif';ctx.textAlign='center';ctx.textBaseline='bottom';chart.data.datasets.forEach((dataset,di)=>{const meta=chart.getDatasetMeta(di);if(meta.hidden)return;meta.data.forEach((element,i)=>{if(compact&&chart.config.type==='line'&&i%3!==0&&i!==meta.data.length-1)return;const raw=dataset.data[i];if(raw===null||raw===undefined||!Number.isFinite(Number(raw))||Number(raw)===0)return;const pos=element.tooltipPosition();let y=pos.y-5;if(y<area.top+9)y=pos.y+12;ctx.fillStyle=dataset.borderColor||dataset.backgroundColor||'#334155';ctx.fillText(p2FmtMetric(raw),pos.x,y);});});ctx.restore();}};
function p2Chart(id,type,data,options){if(p2Charts[id])p2Charts[id].destroy();const ctx=p2$(id);const defaults={responsive:true,maintainAspectRatio:false,font:{family:'Inter, Segoe UI, Arial, sans-serif'},plugins:{legend:{display:type!=='doughnut',position:'bottom',labels:{boxWidth:10,font:{size:9}}}},scales:type==='doughnut'?{}:{y:{beginAtZero:true,grid:{display:false,drawBorder:false},ticks:{font:{size:9}}},x:{grid:{display:false,drawBorder:false},ticks:{font:{size:9},maxRotation:0,minRotation:0}}}};p2Charts[id]=new Chart(ctx,{type,data,options:Object.assign(defaults,options||{}),plugins:type==='doughnut'?[p2CenterText]:[p2ValueLabels]});}
function p2RenderDonut(key,canvasId,legendId){
 const metric=p2MetricValue;
 const arr=(p2Data.donut[key]||[]).filter(x=>Number(x[metric])>0).sort((a,b)=>b[metric]-a[metric]).slice();
 const total=arr.reduce((s,x)=>s+Number(x[metric]||0),0);
 const colors=arr.map((x,i)=>p2Palette[i%p2Palette.length]);
 p2Chart(canvasId,'doughnut',{labels:arr.map(x=>x.name),datasets:[{data:arr.map(x=>Number(x[metric]||0)),backgroundColor:colors,borderColor:'#d9c8ad',borderWidth:1.5,hoverOffset:4}]},{cutout:'56%',plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`${c.label}: ${p2FmtMetric(c.raw,metric)}${metric==='value'?'':' '+metric.toUpperCase()} (${total?(c.raw/total*100).toFixed(1):0}%)`}}}});
 const legend=p2$(legendId);if(!arr.length){legend.innerHTML='<div class="p2-empty">Tidak ada data pada filter terpilih.</div>';return;}
 legend.innerHTML=arr.map((x,i)=>{const share=total?Number(x[metric])/total*100:0;const growth=metric==='value'?x.valueGrowth:x.growth;const cls=growth===null||growth===undefined?'neu':growth>0?'pos':growth<0?'neg':'neu';return `<div class="p2-donut-row"><div class="p2-donut-name" style="color:${colors[i]}">${p2Esc(x.name)}</div><div class="p2-donut-meta"><span class="p2-donut-share">${share.toFixed(1)}% • ${p2FmtMetric(x[metric],metric)}${metric==='value'?'':' '+metric.toUpperCase()}</span><span class="p2-donut-growth ${cls}">${p2Growth(growth)}</span></div></div>`;}).join('');
}
function p2SummaryMetric(v,metric){return metric==='value'?p2FmtValue(v):p2Fmt(v);}
function p2SetSummaryGrowth(id,value){const el=p2$(id);if(!el)return;el.textContent=p2Growth(value);el.className='';el.style.color=value===null?'#718096':value>0?'#16834a':value<0?'#dc4242':'#718096';}
function page2RenderChartInsights(){
 const d=p2Data,k=d.kpi,metric=p2MetricValue,lyKey=metric==='value'?'valueLy':metric==='ao'?'aoLy':'ecLy';
 const order=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
 const lastIndex=order.indexOf(k.mtdMonth),ytdMonths=lastIndex>=0?order.slice(0,lastIndex+1):[];
 const l3m=lastIndex>=0?order.slice(Math.max(0,lastIndex-2),lastIndex+1):[];
 const sum=(months,key)=>months.reduce((total,m)=>total+(Number((d.monthly.find(x=>x.month===m)||{})[key])||0),0);
 const ytdCy=sum(ytdMonths,metric),ytdLy=sum(ytdMonths,lyKey),l3mCy=sum(l3m,metric);
 p2$('p2MonthlyAvgYtd').textContent=p2SummaryMetric(ytdMonths.length?ytdCy/ytdMonths.length:0,metric);
 p2$('p2MonthlyAvgL3m').textContent=p2SummaryMetric(l3m.length?l3mCy/l3m.length:0,metric);
 p2SetSummaryGrowth('p2MonthlyGrowthYtd',ytdLy?(ytdCy/ytdLy-1)*100:(ytdCy?null:0));
 p2$('p2MonthlyTotalYtd').textContent=p2SummaryMetric(ytdCy,metric);
 const cy=k.dailyCYMTD||{},ly=k.dailyLYMTD||{},days=Number(cy.days)||0;
 const cyTotal=Number(cy[metric])||0,lyTotal=Number(ly[metric])||0;
 const avg=days?cyTotal/days:0;
 p2$('p2DailyAvgCy').textContent=p2SummaryMetric(avg,metric);
 p2$('p2DailyBestDay').textContent=metric==='value'?(cy.bestDay?'Tgl '+cy.bestDay:'—'):(cy.bestDay?'Tgl '+cy.bestDay:'—');
 p2$('p2DailyBestValue').textContent=cy.bestDay?p2SummaryMetric(metric==='value'?cy.bestValue:0,metric)+' • '+(k.mtdMonth||''):'Belum ada data';
 p2$('p2DailyTotalMtd').textContent=p2SummaryMetric(cyTotal,metric);
 p2SetSummaryGrowth('p2DailyGrowthLy',lyTotal?(cyTotal/lyTotal-1)*100:(cyTotal?null:0));
 const labels=daily.map(x=>x.day);
 const bestIndex=cy.bestDay?Number(cy.bestDay)-1:-1;
 const bestValue=metric==='value'?cy.bestValue:Math.max(0,...daily.map(x=>Number(x[metric])||0));
 p2$('p2DailyBestValue').textContent=bestIndex>=0?p2SummaryMetric(bestValue,metric)+' • Tanggal '+cy.bestDay:'Belum ada data';
}
function page2DrawCharts(){const d=p2Data,metric=p2MetricValue;
 const monthly=d.monthly.filter(x=>d.kpi.months.includes(x.month));
 const lyKey=metric==='value'?'valueLy':metric==='ao'?'aoLy':'ecLy';
 // Dataset LY lebih dulu agar batang CY biru selalu berada di sisi kanan.
 p2Chart('p2MonthlyChart','bar',{labels:monthly.map(x=>x.month),datasets:[{label:String(d.kpi.ly),data:monthly.map(x=>x[lyKey]),backgroundColor:'#a5afbd',borderRadius:5},{label:String(d.kpi.year),data:monthly.map(x=>x[metric]),backgroundColor:'#2563eb',borderRadius:5}]},{plugins:{legend:{position:'bottom',labels:{boxWidth:10,font:{size:9}}},p2ValueLabels:{enabled:true}}});
 const daily=d.daily||[];
 p2Chart('p2DailyChart','line',{labels:daily.map(x=>x.day),datasets:[{label:String(d.kpi.ly)+' • LY',data:daily.map(x=>Number(x[lyKey])||0),tension:.25,fill:false,borderColor:'#a5afbd',backgroundColor:'#a5afbd',pointRadius:2},{label:String(d.kpi.year)+' • CY',data:daily.map(x=>Number(x[metric])||0),tension:.25,fill:false,borderColor:'#2563eb',backgroundColor:'#2563eb',pointRadius:2}]},{plugins:{p2ValueLabels:{enabled:true}},scales:{x:{grid:{display:false},ticks:{font:{size:9},autoSkip:false,callback:(v,i)=>String(i+1).padStart(2,'0')}},y:{beginAtZero:true,grid:{display:false},ticks:{font:{size:9}}}}});
 page2RenderChartInsights();
 p2RenderDonut('subdist','p2SubdistChart','p2SubdistLegend');
 p2RenderDonut('team','p2TeamChart','p2TeamLegend');
 p2RenderDonut('subbrand','p2SubbrandChart','p2SubbrandLegend');
}
function page2SetMetric(metric){p2MetricValue=metric;document.querySelectorAll('#p2MetricSwitch button').forEach(b=>{const active=b.dataset.metric===metric;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active));});if(p2Data)page2DrawCharts();}
document.addEventListener('click',e=>{const metricButton=e.target.closest('#p2MetricSwitch button[data-metric]');if(metricButton)page2SetMetric(metricButton.dataset.metric);});


function page2Show(){
  document.body.classList.add('page2-active');
  const view=p2$('page2View');
  document.querySelectorAll('main.wrap > *').forEach(el=>{
   if(el===view)return;
   el.hidden=true;
   el.style.setProperty('display','none','important');
  });
  if(view){
   view.hidden=false;
   view.style.setProperty('display','block','important');
  }
  document.querySelector('.p2-nav')?.classList.add('active');
  document.querySelector('.p1-nav')?.classList.remove('active');
  window.scrollTo(0,0);
  if(!p2Meta)page2Init();
}
function page1Show(){
  const view=p2$('page2View');
  if(view){
   view.hidden=true;
   view.style.setProperty('display','none','important');
  }
  document.querySelectorAll('main.wrap > *').forEach(el=>{
   if(el===view)return;
   el.hidden=false;
   el.style.removeProperty('display');
  });
  document.body.classList.remove('page2-active');
  document.querySelector('.p2-nav')?.classList.remove('active');
  document.querySelector('.p1-nav')?.classList.add('active');
  window.scrollTo(0,0);
}

</script>
