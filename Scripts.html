<script>

let rows=[];
let targetRows=[];

const months=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'], labels=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const $=id=>document.getElementById(id), n=v=>Number(v)||0, sum=a=>a.reduce((s,r)=>s+n(r.v),0);
const fmt=v=>new Intl.NumberFormat('id-ID',{notation:'compact',maximumFractionDigits:2}).format(v||0);
const pct=v=>v===null||!Number.isFinite(v)?'N/A':(v>=0?'+':'')+v.toFixed(1)+'%';
const achClass=v=>v===null||!Number.isFinite(v)?'neutral':v>=110?'ach-blue':v>=95?'ach-darkgreen':v>=85?'ach-lightgreen':v>=75?'ach-orange':'ach-red';
const ctrClass=v=>!Number.isFinite(v)?'neutral':v>=25?'ctr-blue':v>=10?'ctr-darkgreen':v>=5?'ctr-lightgreen':v>=3?'ctr-orange':'ctr-red';

let charts={};
let renderFilterCache = null;
let dashboardOutsideClickBound = false;
function opts(id,values){let el=$(id),old=el.value;el.innerHTML='<option value="ALL">Semua</option>'+values.map(v=>`<option value="${String(v).replaceAll('"','&quot;')}">${v}</option>`).join('');if([...el.options].some(o=>o.value===old))el.value=old;}
function selectedMonths(){return [...document.querySelectorAll('#monthChecks input:checked')].map(x=>x.value).sort((a,b)=>months.indexOf(a)-months.indexOf(b));}
function updateMonthLabel(){const chosen=selectedMonths(),btn=$('monthTrigger');btn.textContent='Pilih Bulan';btn.title=chosen.length?chosen.map(m=>labels[months.indexOf(m)]).join(', '):'Belum ada bulan dipilih';}
function setMonths(list, shouldRender=true){document.querySelectorAll('#monthChecks input').forEach(x=>x.checked=list.includes(x.value));updateMonthLabel();if(shouldRender)render();}
function p1AvailableMonths(){const y=Number($('year').value),typ=$('sales').value;return months.filter(m=>rows.some(r=>r.y===y&&r.m===m&&r.t===typ&&n(r.v)!==0));}
function p1SetYtdMonths(shouldRender=false){const available=p1AvailableMonths();const last=available.length?months.indexOf(available[available.length-1]):-1;setMonths(months.slice(0,last+1),shouldRender);}
function selectedSubdists(){return [...document.querySelectorAll('#subdistChecks input:checked')].map(x=>x.value);}
function selectedPics(){return [...document.querySelectorAll('#picChecks input:checked')].map(x=>x.value);}
function isPicSelected(value){return selectedPics().includes(String(value||''));}
function updatePicLabel(){const chosen=selectedPics(),all=[...document.querySelectorAll('#picChecks input')].map(x=>x.value),btn=$('picTrigger');btn.textContent=chosen.length===all.length?'Semua PIC':chosen.length===0?'Tidak ada PIC':chosen.length===1?chosen[0]:chosen.length+' PIC dipilih';btn.title=chosen.join(', ');$('pic').value=chosen.length===all.length?'ALL':chosen.length===1?chosen[0]:'';}
function setPics(list){document.querySelectorAll('#picChecks input').forEach(x=>x.checked=list.includes(x.value));updatePicLabel();}
function isSubdistSelected(value){
 return renderFilterCache ? renderFilterCache.subdists.has(String(value)) : selectedSubdists().includes(String(value));
}
function updateSubdistLabel(){const chosen=selectedSubdists(),all=[...document.querySelectorAll('#subdistChecks input')].map(x=>x.value);const btn=$('subdistTrigger');btn.textContent=chosen.length===all.length?'Semua Subdist':chosen.length===0?'Tidak ada Subdist':chosen.length===1?chosen[0]:chosen.length+' Subdist dipilih';btn.title=chosen.join(', ');}
function setSubdists(list){document.querySelectorAll('#subdistChecks input').forEach(x=>x.checked=list.includes(x.value));updateSubdistLabel();}
const productFilterDefs={brand:{field:'b',label:'Brand',values:'brandChecks',trigger:'brandTrigger',filter:'brandFilter',all:'selectAllBrands',clear:'clearBrands',prefix:'Semua Brand'},subbrand:{field:'s',label:'Subbrand',values:'subbrandChecks',trigger:'subbrandTrigger',filter:'subbrandFilter',all:'selectAllSubbrands',clear:'clearSubbrands',prefix:'Semua Subbrand'},category:{field:'c',label:'Category',values:'categoryChecks',trigger:'categoryTrigger',filter:'categoryFilter',all:'selectAllCategories',clear:'clearCategories',prefix:'Semua Category'}};
function selectedProductValues(key){return [...document.querySelectorAll('#'+productFilterDefs[key].values+' input:checked')].map(x=>x.value);}
function refreshRenderFilterCache(){
 const productSets={};
 Object.keys(productFilterDefs).forEach(key=>{
  productSets[key]=new Set(selectedProductValues(key).map(String));
 });
 renderFilterCache={
  subdists:new Set(selectedSubdists().map(String)),
  productSets:productSets
 };
}
function isProductFilterSelected(r){
 if(!renderFilterCache){
  return Object.keys(productFilterDefs).every(key=>selectedProductValues(key).includes(String(r[productFilterDefs[key].field]||'')));
 }
 return Object.keys(productFilterDefs).every(key=>{
  const field=productFilterDefs[key].field;
  return renderFilterCache.productSets[key].has(String(r[field]||''));
 });
}
function updateProductFilterLabel(key){const d=productFilterDefs[key],chosen=selectedProductValues(key),all=[...document.querySelectorAll('#'+d.values+' input')].map(x=>x.value),btn=$(d.trigger);btn.textContent=chosen.length===all.length?d.prefix:chosen.length===0?'Tidak ada '+d.label:chosen.length===1?chosen[0]:chosen.length+' '+d.label+' dipilih';btn.title=chosen.join(', ');}
function setProductFilter(key,list){const d=productFilterDefs[key];document.querySelectorAll('#'+d.values+' input').forEach(x=>x.checked=list.includes(x.value));updateProductFilterLabel(key);}
function initProductFilters(){Object.keys(productFilterDefs).forEach(key=>{const d=productFilterDefs[key],field=d.field,values=[...new Set([...rows,...targetRows].map(r=>r[field]).filter(Boolean).map(String))].sort((a,b)=>a.localeCompare(b));$(d.values).innerHTML=values.map(v=>`<label><input type="checkbox" value="${v.replaceAll('&','&amp;').replaceAll('\"','&quot;').replaceAll('<','&lt;')}" checked><span>${v.replaceAll('&','&amp;').replaceAll('<','&lt;')}</span></label>`).join('');document.querySelectorAll('#'+d.values+' input').forEach(x=>x.addEventListener('change',()=>updateProductFilterLabel(key)));$(d.trigger).onclick=()=>{const f=$(d.filter);f.classList.toggle('open');$(d.trigger).setAttribute('aria-expanded',f.classList.contains('open')?'true':'false');};$(d.all).onclick=()=>setProductFilter(key,values);$(d.clear).onclick=()=>setProductFilter(key,[]);$((key==='category'?'applyCategories':'apply'+key.charAt(0).toUpperCase()+key.slice(1)+'s')).onclick=()=>{render();$(d.filter).classList.remove('open');$(d.trigger).setAttribute('aria-expanded','false');};updateProductFilterLabel(key);});}

document.addEventListener('input',e=>{
 const search=e.target?.closest('[data-p1-search]');
 if(search){
  const box=$(search.dataset.p1Search),q=String(search.value||'').trim().toLocaleLowerCase('id');
  box?.querySelectorAll('label').forEach(item=>{item.style.display=!q||item.textContent.toLocaleLowerCase('id').includes(q)?'':'none';});
  return;
 }
});
function init(){
 $('monthChecks').innerHTML=months.map((m,i)=>`<label><input type="checkbox" value="${m}"><span>${labels[i]}</span></label>`).join('');
 opts('subdist',[...new Set(rows.map(r=>r.d).filter(Boolean))].sort());
 $('subdistChecks').innerHTML=[...new Set(rows.map(r=>r.d).filter(Boolean))].sort().map(d=>`<label><input type="checkbox" value="${d.replaceAll('&','&amp;').replaceAll('\"','&quot;')}"><span>${d}</span></label>`).join('');
 initProductFilters();
 const picValues=[...new Set([...rows,...targetRows].map(r=>r.p).filter(Boolean).map(String))].sort((a,b)=>a.localeCompare(b,'id')); opts('pic',picValues); $('picChecks').innerHTML=picValues.map(v=>'<label><input type="checkbox" value="'+v.replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;')+'"><span>'+v.replaceAll('&','&amp;').replaceAll('<','&lt;')+'</span></label>').join(''); document.querySelectorAll('#picChecks input').forEach(x=>x.addEventListener('change',updatePicLabel)); $('picTrigger').onclick=()=>{const f=$('picFilter');f.classList.toggle('open');$('picTrigger').setAttribute('aria-expanded',f.classList.contains('open')?'true':'false');}; $('selectAllPics').onclick=()=>setPics(picValues); $('clearPics').onclick=()=>setPics([]); $('applyPics').onclick=()=>{render();$('picFilter').classList.remove('open');$('picTrigger').setAttribute('aria-expanded','false');}; setPics(picValues);
 $('year').value='2026'; $('sales').value='SOO';
  document.querySelectorAll('#subdistChecks input').forEach(x=>{x.checked=true;x.addEventListener('change',updateSubdistLabel);});
  $('subdistTrigger').onclick=()=>{const f=$('subdistFilter');f.classList.toggle('open');$('subdistTrigger').setAttribute('aria-expanded',f.classList.contains('open')?'true':'false');};
  $('selectAllSubdists').onclick=()=>setSubdists([...document.querySelectorAll('#subdistChecks input')].map(x=>x.value));
  $('clearSubdists').onclick=()=>setSubdists([]);$('applySubdists').onclick=()=>{render();$('subdistFilter').classList.remove('open');$('subdistTrigger').setAttribute('aria-expanded','false');};
  updateSubdistLabel();
 document.querySelectorAll('#monthChecks input').forEach(x=>x.addEventListener('change',updateMonthLabel));
 $('monthTrigger').onclick=()=>{const f=$('monthFilter');f.classList.toggle('open');$('monthTrigger').setAttribute('aria-expanded',f.classList.contains('open')?'true':'false');};
 if(!dashboardOutsideClickBound){
  document.addEventListener('click',e=>{['month','pic','subdist','brand','subbrand','category'].forEach(k=>{const f=$(k+'Filter'),t=$(k+'Trigger');if(f&&!f.contains(e.target)){f.classList.remove('open');t.setAttribute('aria-expanded','false');}});});
  dashboardOutsideClickBound=true;
 }
 $('selectAllMonths').onclick=()=>{document.querySelectorAll('#monthChecks input').forEach(x=>x.checked=true);updateMonthLabel();};
 $('clearMonths').onclick=()=>{document.querySelectorAll('#monthChecks input').forEach(x=>x.checked=false);updateMonthLabel();};
 $('resetYtd').onclick=()=>p1SetYtdMonths(false);
 $('applyMonths').onclick=()=>{render();$('monthFilter').classList.remove('open');$('monthTrigger').setAttribute('aria-expanded','false');};
 ['year','sales'].forEach(id=>$(id).addEventListener('change',()=>p1SetYtdMonths(true)));
 ['subdist','pic'].forEach(id=>$(id).addEventListener('change',render));
 p1SetYtdMonths(false); // samakan Reset ke YTD Page 1 dengan ketersediaan bulan pada Page 2
}
function filtered(year,month,dimValue=null,dim=null){
 return rows.filter(r=>r.y===Number(year)&&r.t===$('sales').value&&isSubdistSelected(r.d)&&isProductFilterSelected(r)&&(!dim||r[dim]===dimValue)&&isPicSelected(r.p)&&
 (month==='ALL'||r.m===month));
}
function targetVal(r,typ,month){return n(r[typ+'_'+month]);}
function targetTotal(dim, key, typ, monthList, scopeCategory=null){
 if(Number($('year').value)!==2026)return 0;
 return targetRows.filter(r=>(r.u==='B7'||r.u==='SAKA')&&(!scopeCategory||r.c===scopeCategory)&&isSubdistSelected(r.d)&&isProductFilterSelected(r)&&isPicSelected(r.p)&&(!dim||r[dim]===key))
 .reduce((s,r)=>s+monthList.reduce((a,m)=>a+targetVal(r,typ,m),0),0);
}
function sumByDim(data,dim){let o={};data.forEach(r=>{let k=r[dim]||'(Kosong)';o[k]=(o[k]||0)+n(r.v)});return o}
function chart(id,type,data,options={}){if(typeof Chart==='undefined'||!$(id))return;if(charts[id])charts[id].destroy();charts[id]=new Chart($(id),{type,data,options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:type==='doughnut'?'bottom':'top',labels:{boxWidth:10,font:{size:10}}}},...options}})}
const donutLegend={id:'donutLegend',afterDatasetsDraw(ch){if(ch.config.type!=='doughnut'||!ch.data.datasets?.[0])return;const ctx=ch.ctx,ds=ch.data.datasets[0],vals=ds.data||[],labels=ch.data.labels||[],colors=ds.backgroundColor||[],growth=ds.growth||[],total=vals.reduce((a,b)=>a+(Number(b)||0),0);if(!total)return;const area=ch.chartArea,x=area.right+8,w=Math.max(54,ch.width-x-8),count=labels.length,rowH=Math.min(25,area.height/Math.max(count,1)),totalH=rowH*count,startY=area.top+(area.height-totalH)/2;const ctrColor=v=>v>=25?'#2563eb':v>=10?'#166534':v>=5?'#65a30d':v>=3?'#ea580c':'#991b1b';ctx.save();ctx.textBaseline='middle';labels.forEach((label,i)=>{const y=startY+i*rowH,con=Number(vals[i])/total*100,g=growth[i];ctx.fillStyle=colors[i]||'#64748b';ctx.font='700 8px Inter,Segoe UI,Arial';ctx.textAlign='left';ctx.fillText(String(label).slice(0,17),x,y+rowH*.30,w);ctx.fillStyle=ctrColor(con);ctx.font='700 8px Inter,Segoe UI,Arial';ctx.fillText(con.toFixed(1)+'%',x,y+rowH*.70,Math.max(26,w*.42));ctx.fillStyle=g==null?'#64748b':g>=0?'#65a30d':'#dc2626';ctx.textAlign='right';ctx.fillText(g==null?'N/A':(g>0?'+':'')+Number(g).toFixed(1)+'%',x+w,y+rowH*.70,Math.max(28,w*.48));if(i<count-1){ctx.strokeStyle='#edf1f6';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,y+rowH-1);ctx.lineTo(x+w,y+rowH-1);ctx.stroke();}});ctx.restore();}};if(typeof Chart!=='undefined')Chart.register(donutLegend);
function monthListForPeriod(){return selectedMonths();}
function ytdMonths(){const sel=selectedMonths();if(!sel.length)return [];const last=Math.max(...sel.map(m=>months.indexOf(m)));return months.slice(0,last+1);}
function previousMonthKey(m,y){let i=months.indexOf(m);return i===0?{m:'DEC',y:y-1}:{m:months[i-1],y};}
function monthActual(y,m,dim,key,scopeCategory=null){return sum(rows.filter(r=>r.y===y&&r.m===m&&r.t===$('sales').value&&(!dim||r[dim]===key)&&(scopeCategory===null||r.c===scopeCategory)&&isSubdistSelected(r.d)&&isProductFilterSelected(r)&&isPicSelected(r.p)));}
function mtdMonth(){const chosen=selectedMonths();return chosen.length?chosen[chosen.length-1]:null;}
function mtdMetrics(dim,key,scopeData=null){
 const y=Number($('year').value),m=mtdMonth(),typ=$('sales').value,scopeCategory=null;
 if(!m)return {actual:0,target:0,ach:null,be:0,beAch:null};
 const match=r=>r.y===y&&r.m===m&&r.t===typ&&(!dim||r[dim]===key)&&(scopeCategory===null||r.c===scopeCategory)&&isSubdistSelected(r.d)&&isProductFilterSelected(r)&&isPicSelected(r.p);
 const actual=sum(rows.filter(match));
 const target=y===2026?sumTargetForMonth(dim,key,typ,m,scopeCategory):0;
 const be=sum(rows.filter(r=>r.y===y&&r.m===m&&r.t===typ&&(!dim||r[dim]===key)&&(scopeCategory===null||r.c===scopeCategory)&&isSubdistSelected(r.d)&&isProductFilterSelected(r)&&isPicSelected(r.p)).map(r=>({v:r.be||0})));
 return {actual,target,ach:target?actual/target*100:null,be,beVsTarget:target?be/target*100:null};
}
function sumTargetForMonth(dim,key,typ,m,scopeCategory=null){return targetRows.filter(r=>(r.u==='B7'||r.u==='SAKA')&&(!scopeCategory||r.c===scopeCategory)&&isSubdistSelected(r.d)&&isProductFilterSelected(r)&&isPicSelected(r.p)&&(!dim||r[dim]===key)).reduce((a,r)=>a+targetVal(r,typ,m),0);}
function metricsFor(dim,key,periodMonths,grand){
 const typ=$('sales').value,y=Number($('year').value);
 const actual=sum(filtered(y,'ALL',key,dim).filter(r=>periodMonths.includes(r.m)));
 const target=targetTotal(dim,key,typ,periodMonths);
 const ly=sum(rows.filter(r=>r.y===y-1&&r.t===typ&&(!dim||r[dim]===key)&&periodMonths.includes(r.m)&&isSubdistSelected(r.d)&&isProductFilterSelected(r)&&isPicSelected(r.p)));
 // GRW vs LM dan L3M selalu memakai bulan terakhir yang dipilih (bulan berjalan), bukan akumulasi YTD.
 const currentMonth=mtdMonth();
 let lm=null,last3=null;
 if(currentMonth){
  const currentValue=monthActual(y,currentMonth,dim,key);
  const prev=previousMonthKey(currentMonth,y);
  const prevValue=monthActual(prev.y,prev.m,dim,key);
  lm=prevValue?((currentValue-prevValue)/Math.abs(prevValue))*100:null;
  const idx=months.indexOf(currentMonth),priorKeys=[];
  for(let j=1;j<=3;j++){
   let mi=idx-j,yy=y;
   while(mi<0){mi+=12;yy--;}
   priorKeys.push({m:months[mi],y:yy});
  }
  const prior3Avg=priorKeys.reduce((v,k)=>v+monthActual(k.y,k.m,dim,key),0)/3;
  last3=prior3Avg?((currentValue-prior3Avg)/Math.abs(prior3Avg))*100:null;
 }
 const avg=periodMonths.length?actual/periodMonths.length:0;
 return {actual,target,ach:target?actual/target*100:null,ly:ly?((actual-ly)/Math.abs(ly))*100:null,lm,last3,contrib:grand?actual/grand*100:0,avg};
}
function renderMatrix(dim,bodyId,periodMonths,grand){
 const y=Number($('year').value), typ=$('sales').value, ytd=periodMonths;
 const data=filtered(y,'ALL'), sums=sumByDim(data,dim);
 let keys=Object.keys(sums).sort((a,b)=>sums[b]-sums[a]);
 targetRows.forEach(r=>{let k=r[dim];if(k&&isSubdistSelected(r.d)&&isProductFilterSelected(r)&&isPicSelected(r.p)&&!keys.includes(k))keys.push(k)});
 const cls=v=>v===null||!Number.isFinite(v)?'neutral':v>=0?'positive':'negative';

 // BY SUBDIST: Subdist menjadi baris induk; B7/SAKA menjadi baris subordinat SBU.
 // CTR baris subordinat dihitung terhadap Grand Total SBU masing-masing.
 if(dim==='d' && bodyId==='matrixSubdist'){
  const sbuGrandTotals={
   B7:sum(data.filter(r=>r.u==='B7'&&ytd.includes(r.m))),
   SAKA:sum(data.filter(r=>r.u==='SAKA'&&ytd.includes(r.m)))
  };
  const sbuMetrics=(d,u)=>{
   const match=(r,yy,mm)=>r.y===yy&&r.m===mm&&r.t===typ&&r.d===d&&r.u===u&&isSubdistSelected(r.d)&&isProductFilterSelected(r)&&isPicSelected(r.p);
   const actual=sum(rows.filter(r=>r.y===y&&r.t===typ&&r.d===d&&r.u===u&&ytd.includes(r.m)&&isSubdistSelected(r.d)&&isProductFilterSelected(r)&&isPicSelected(r.p)));
   // Denominator mengikuti SBU yang sama dan seluruh Subdist terpilih.
   const sbuGrand=sbuGrandTotals[u]||0;
   const sbuContribution=sbuGrand?actual/sbuGrand*100:0;
   const target=y===2026?targetRows.filter(r=>r.d===d&&r.u===u&&isSubdistSelected(r.d)&&isProductFilterSelected(r)&&isPicSelected(r.p)).reduce((a,r)=>a+ytd.reduce((v,m)=>v+targetVal(r,typ,m),0),0):0;
   const ly=sum(rows.filter(r=>r.y===y-1&&r.t===typ&&r.d===d&&r.u===u&&ytd.includes(r.m)&&isSubdistSelected(r.d)&&isProductFilterSelected(r)&&isPicSelected(r.p)));
   // Growth SBU memakai Actual bulan berjalan vs bulan sebelumnya / rata-rata 3 bulan sebelumnya.
   const m=mtdMonth();
   let lm=null,last3=null;
   if(m){
    const currentValue=sum(rows.filter(r=>r.y===y&&r.m===m&&r.t===typ&&r.d===d&&r.u===u&&isSubdistSelected(r.d)&&isProductFilterSelected(r)&&isPicSelected(r.p)));
    const prev=previousMonthKey(m,y);
    const prevValue=sum(rows.filter(r=>r.y===prev.y&&r.m===prev.m&&r.t===typ&&r.d===d&&r.u===u&&isSubdistSelected(r.d)&&isProductFilterSelected(r)&&isPicSelected(r.p)));
    lm=prevValue?((currentValue-prevValue)/Math.abs(prevValue))*100:null;
    const idx=months.indexOf(m),priorKeys=[];
    for(let j=1;j<=3;j++){let mi=idx-j,yy=y;while(mi<0){mi+=12;yy--;}priorKeys.push({m:months[mi],y:yy});}
    const prior3Avg=priorKeys.reduce((v,p)=>v+sum(rows.filter(r=>r.y===p.y&&r.m===p.m&&r.t===typ&&r.d===d&&r.u===u&&isSubdistSelected(r.d)&&isProductFilterSelected(r)&&isPicSelected(r.p))),0)/3;
    last3=prior3Avg?((currentValue-prior3Avg)/Math.abs(prior3Avg))*100:null;
   }
   const avg=ytd.length?actual/ytd.length:0;
   const mtdRows=m?rows.filter(r=>match(r,y,m)):[];
   const mtdActual=sum(mtdRows);
   const mtdTarget=(y===2026&&m)?targetRows.filter(r=>r.d===d&&r.u===u&&isSubdistSelected(r.d)&&isProductFilterSelected(r)&&isPicSelected(r.p)).reduce((a,r)=>a+targetVal(r,typ,m),0):0;
   const be=sum(mtdRows.map(r=>({v:r.be||0})));
   return {actual,target,ach:target?actual/target*100:null,ly:ly?((actual-ly)/Math.abs(ly))*100:null,lm,last3,contrib:sbuContribution,avg,mtdActual,mtdTarget,mtdAch:mtdTarget?mtdActual/mtdTarget*100:null,be,beVsTarget:mtdTarget?be/mtdTarget*100:null};
  };
  const makeRow=(label,m,extraClass='')=>`<tr class="${extraClass}"><td>${label}</td><td>${fmt(m.mtdActual)}</td><td>${fmt(m.mtdTarget)}</td><td class="${achClass(m.mtdAch)}">${m.mtdAch===null?'N/A':m.mtdAch.toFixed(1)+'%'}</td><td>${fmt(m.actual)}</td><td>${fmt(m.target)}</td><td class="${achClass(m.ach)}">${m.ach===null?'N/A':m.ach.toFixed(1)+'%'}</td><td class="${cls(m.ly)}">${pct(m.ly)}</td><td class="${cls(m.lm)}">${pct(m.lm)}</td><td class="${cls(m.last3)}">${pct(m.last3)}</td><td class="${ctrClass(m.contrib)}">${m.contrib.toFixed(1)}%</td><td>${fmt(m.avg)}</td><td>${fmt(m.be)}</td><td class="${achClass(m.beVsTarget)}">${m.beVsTarget===null?'N/A':m.beVsTarget.toFixed(1)+'%'}</td></tr>`;
  const rowsHtml=keys.map(k=>{
   const totalM=metricsFor('d',k,ytd,grand), totalQ=mtdMetrics('d',k,data);
   const parent={mtdActual:totalQ.actual,mtdTarget:totalQ.target,mtdAch:totalQ.ach,actual:totalM.actual,target:totalM.target,ach:totalM.ach,ly:totalM.ly,lm:totalM.lm,last3:totalM.last3,contrib:totalM.contrib,avg:totalM.avg,be:totalQ.be,beVsTarget:totalQ.beVsTarget};
   const children=['B7','SAKA'].filter(u=>!(u==='SAKA'&&String(k).trim().toUpperCase()==='DB BAC')).map(u=>makeRow('↳ '+u,sbuMetrics(k,u),'subdist-sbu-row')).join('');
   return makeRow(k,parent,'subdist-total-row')+children;

<script id="robust-monthly-freeze-width">
(function(){
 const FIRST_COL=220, OTHER_COL=78;
 function lockMonthlyFreeze(){
  document.querySelectorAll('.monthly-matrix table').forEach(function(table){
   const count=table.querySelectorAll('thead th').length;
   if(!count)return;
   let cg=table.querySelector(':scope > colgroup');
   if(!cg){cg=document.createElement('colgroup');table.insertBefore(cg,table.firstChild);}
   while(cg.children.length<count)cg.appendChild(document.createElement('col'));
   while(cg.children.length>count)cg.removeChild(cg.lastChild);
   Array.from(cg.children).forEach(function(col,i){
    const w=i===0?FIRST_COL:OTHER_COL;
    col.style.width=w+'px';col.style.minWidth=w+'px';col.style.maxWidth=w+'px';
   });
   table.style.setProperty('table-layout','fixed','important');
   table.style.setProperty('width',(FIRST_COL+(count-1)*OTHER_COL)+'px','important');
   table.style.setProperty('min-width',(FIRST_COL+(count-1)*OTHER_COL)+'px','important');
   table.querySelectorAll('tr').forEach(function(row){
    const cell=row.cells&&row.cells[0];if(!cell)return;
    ['width','min-width','max-width'].forEach(function(prop){cell.style.setProperty(prop,FIRST_COL+'px','important');});
    cell.style.setProperty('box-sizing','border-box','important');
    cell.style.setProperty('position','sticky','important');
    cell.style.setProperty('left','0px','important');
    cell.style.setProperty('z-index',row.parentElement.tagName==='THEAD'?'12':'6','important');
   });
  });
 }
 function start(){
  lockMonthlyFreeze();
  const root=document.querySelector('body');
  if(root){
   new MutationObserver(function(){lockMonthlyFreeze();}).observe(root,{subtree:true,childList:true});
  }

 }

})();

function attachUploadHandler(){
 $('fileInput').addEventListener('change', async e=>{
  const file=e.target.files[0]; if(!file) return;
  const status=$('status');
  try{
   status.textContent='Membaca workbook '+file.name+'...';
   const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});
   const dataSheet=wb.Sheets['DATA_SALES']||wb.Sheets['RAW DATA BY SUBRAND']||wb.Sheets[wb.SheetNames[0]];
   const rawSourceSheet=wb.Sheets['RAW_DATA_SALES'];
   if(!dataSheet) throw new Error('Sheet DATA_SALES tidak ditemukan.');
   if(!rawSourceSheet) throw new Error('Sheet RAW_DATA_SALES tidak ditemukan. File harus memuat kedua sheet database.');
   const json=XLSX.utils.sheet_to_json(dataSheet,{defval:null});
   if(!json.length||!('YEAR' in json[0])||!('VAL' in json[0])) throw new Error('Kolom YEAR dan VAL pada DATA_SALES tidak ditemukan.');
   const rawRange=XLSX.utils.decode_range(rawSourceSheet['!ref']||'A1:AA1');
   rawRange.s.c=0;rawRange.e.c=26;
   const rawMatrix=XLSX.utils.sheet_to_json(rawSourceSheet,{header:1,defval:null,raw:true,range:rawRange});
   const expectedRawHeaders=['TAHUN','BULAN','TANGGAL','KODE ITEM','NAMA ITEM','SUB BRAND','BRAND','KARTON','SUBDIST','KODE CUSTOMER','CUSTOMER NAME','KODE SALUR','VAL','QTY','CLASS PRODUCT','UMBRAND','DOT','CATEGORY','JENIS SALES','PIC','SUB_DIST','TIM','SALESMAN','SBU','PF Bulanan','PF Triwulan','PRODUCT_DESC'];
   const actualRawHeaders=(rawMatrix[0]||[]).slice(0,27).map(v=>String(v==null?'':v).trim().toUpperCase());
   if(actualRawHeaders.length!==27||!expectedRawHeaders.every((v,i)=>actualRawHeaders[i]===v.toUpperCase())) throw new Error('Header RAW_DATA_SALES tidak sesuai format A:AA.');
   const rawImported=rawMatrix.slice(1).filter(r=>r&&r.some(v=>v!==null&&v!=='')).map(r=>r.slice(0,27));
   if(!rawImported.length) throw new Error('RAW_DATA_SALES tidak memiliki baris data.');
   const imported=json.map((r,i)=>{
    const amount=Number(r.VAL);
    const row={
     y:Number(r.YEAR),m:String(r.MONTH||'').trim().toUpperCase(),d:String(r.SUBDIST||''),
     s:String(r.Subbrand||r.SUBBRAND||''),b:String(r.Brand||r.BRAND||''),
     c:String(r.CATEGORY||''),u:String(r.SBU||''),p:String(r.PIC||''),
     fm:String(r['PF Bulanan']||''),fq:String(r['PF Triwulan']||''),
     v:amount,t:String(r['JENIS SALES']||r.JENIS_SALES||'').trim().toUpperCase(),
     tg:r.TARGET==null||r.TARGET===''?null:Number(r.TARGET),
     be:r.BE==null||r.BE===''?null:Number(r.BE)
    };
    if(!Number.isInteger(row.y)||!months.includes(row.m)||!Number.isFinite(row.v)||(row.t!=='SO'&&row.t!=='SOO')){
     throw new Error('Data tidak valid pada baris Excel ke-'+(i+2)+'. Periksa YEAR, MONTH, VAL, dan JENIS SALES. Tidak ada data yang disimpan.');
    }
    if(row.tg!==null&&!Number.isFinite(row.tg)) throw new Error('TARGET tidak valid pada baris Excel ke-'+(i+2)+'.');
    if(row.be!==null&&!Number.isFinite(row.be)) throw new Error('BE tidak valid pada baris Excel ke-'+(i+2)+'.');
    return row;
   });
   if(!imported.length) throw new Error('Tidak ada baris data untuk diimpor.');
   status.textContent='Menyiapkan dua database: '+imported.length.toLocaleString('id-ID')+' DATA_SALES dan '+rawImported.length.toLocaleString('id-ID')+' RAW_DATA_SALES...';
   const session=await gasCall('beginSalesImport',{total:imported.length,rawTotal:rawImported.length,filename:file.name});
   const chunkSize=1000;
   const totalChunks=Math.max(Math.ceil(imported.length/chunkSize),Math.ceil(rawImported.length/chunkSize));
   for(let i=0;i<totalChunks;i++){
    const chunk=imported.slice(i*chunkSize,(i+1)*chunkSize);
    const rawChunk=rawImported.slice(i*chunkSize,(i+1)*chunkSize);
    await gasCall('appendSalesImportChunk',{token:session.token,chunk:chunk,rawChunk:rawChunk});
    const dataDone=Math.min((i+1)*chunkSize,imported.length);
    const rawDone=Math.min((i+1)*chunkSize,rawImported.length);
    status.textContent='Mengunggah dua database • DATA_SALES '+dataDone.toLocaleString('id-ID')+'/'+imported.length.toLocaleString('id-ID')+' • RAW_DATA_SALES '+rawDone.toLocaleString('id-ID')+'/'+rawImported.length.toLocaleString('id-ID');
   }
   const result=await gasCall('finishSalesImport',{token:session.token});
   rows=result.rows||[]; targetRows=buildTargets(rows); init(); render();
   status.textContent='Kedua database diperbarui • '+file.name+' • DATA_SALES '+imported.length.toLocaleString('id-ID')+' baris • RAW_DATA_SALES '+rawImported.length.toLocaleString('id-ID')+' baris';
   alert('Import berhasil. DATA_SALES ('+imported.length.toLocaleString('id-ID')+' baris) dan RAW_DATA_SALES ('+rawImported.length.toLocaleString('id-ID')+' baris) telah diperbarui.');
  }catch(err){
   status.textContent='Import gagal: '+err.message;
   alert('Gagal mengimpor data: '+err.message);
  }finally{e.target.value='';}
 });
}
function gasCall(fn,arg){
 return new Promise((resolve,reject)=>{
  const runner=google.script.run.withSuccessHandler(resolve).withFailureHandler(err=>reject(new Error(err&&err.message?err.message:String(err))));
  if(arg===undefined) runner[fn](); else runner[fn](arg);
 });
}

function buildTargets(sourceRows){
 const grouped=new Map();
 sourceRows.forEach(r=>{
  if(Number(r.y)!==2026||r.tg===null||r.tg===undefined||!Number.isFinite(Number(r.tg)))return;
  const key=[r.d,r.s,r.b,r.c,r.u,r.p,r.fm,r.fq].join('|');
  if(!grouped.has(key)){
   const o={d:r.d,s:r.s,b:r.b,c:r.c,u:r.u,p:r.p,fm:r.fm,fq:r.fq};
   grouped.set(key,o);
  }
  const o=grouped.get(key),field=r.t+'_'+r.m;
  o[field]=(o[field]||0)+Number(r.tg||0);
 });
 return [...grouped.values()];
}

(function () {
  'use strict';
  const root = document.documentElement;
  let rafPending = false;

  function cssPx(name, fallback) {
    const value = parseFloat(getComputedStyle(root).getPropertyValue(name));
    return Number.isFinite(value) ? value : fallback;
  }

  function syncMatrixGeometry() {
    const freezeWidth = cssPx('--matrix-freeze-col', 220);
    const trendWidth = cssPx('--matrix-trend-col', 78);

    document.querySelectorAll('.panel.matrix').forEach(function (panel) {
      const wrap = panel.querySelector('.tablewrap');
      const table = wrap && wrap.querySelector('table');
      if (!wrap || !table) return;

      wrap.style.minWidth = '0';
      wrap.style.maxWidth = '100%';
      wrap.style.overflowX = 'auto';

      const headerCells = Array.from(table.querySelectorAll('thead th'));
      const colgroup = table.querySelector('colgroup.locked-columns');
      if (colgroup) {
        Array.from(colgroup.children).forEach(function (col, index) {
          const hidden = !!(headerCells[index] && headerCells[index].hidden);
          col.style.display = hidden ? 'none' : '';
          if (index === 0) {
            col.style.width = freezeWidth + 'px';
            col.style.minWidth = freezeWidth + 'px';
            col.style.maxWidth = freezeWidth + 'px';
          } else if (panel.classList.contains('monthly-matrix')) {
            col.style.width = trendWidth + 'px';
            col.style.minWidth = trendWidth + 'px';
            col.style.maxWidth = trendWidth + 'px';
          }
        });
      }

      table.style.borderCollapse = 'separate';
      table.style.borderSpacing = '0';
      table.style.tableLayout = 'fixed';

      if (panel.classList.contains('monthly-matrix')) {
        const visibleCount = headerCells.filter(function (cell) {
          return !cell.hidden && getComputedStyle(cell).display !== 'none';
        }).length;
        const exactWidth = freezeWidth + Math.max(0, visibleCount - 1) * trendWidth;
        table.style.width = exactWidth + 'px';
        table.style.minWidth = exactWidth + 'px';
        table.style.maxWidth = 'none';
      } else {
        const mobileKpi = window.matchMedia('(max-width: 700px)').matches;
        const metricWidth = mobileKpi ? 82 : null;
        const exactKpiWidth = freezeWidth + Math.max(0, headerCells.length - 1) * (metricWidth || 0);
        table.style.width = mobileKpi ? exactKpiWidth + 'px' : '100%';
        table.style.minWidth = mobileKpi ? exactKpiWidth + 'px' : '0';
        table.style.maxWidth = mobileKpi ? 'none' : '100%';
        Array.from(table.rows).forEach(function (row) {
          Array.from(row.cells || []).forEach(function (cell, index) {
            if (index === 0) return;
            if (mobileKpi) {
              cell.style.width = metricWidth + 'px';
              cell.style.minWidth = metricWidth + 'px';
              cell.style.maxWidth = metricWidth + 'px';
              cell.style.whiteSpace = 'nowrap';
            } else {
              cell.style.removeProperty('width');
              cell.style.removeProperty('min-width');
              cell.style.removeProperty('max-width');
            }
          });
        });
      }

      Array.from(table.rows).forEach(function (row) {
        const firstCell = row.cells && row.cells[0];
        if (!firstCell) return;
        firstCell.style.boxSizing = 'border-box';
        firstCell.style.width = freezeWidth + 'px';
        firstCell.style.minWidth = freezeWidth + 'px';
        firstCell.style.maxWidth = freezeWidth + 'px';
        firstCell.style.position = 'sticky';
        firstCell.style.left = '0';
      });
    });
  }

  function scheduleSync() {
    if (rafPending) return;
    rafPending = true;
    requestAnimationFrame(function () {
      rafPending = false;
      syncMatrixGeometry();
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', scheduleSync, { once: true });
  } else {
    scheduleSync();
  }
  window.addEventListener('load', scheduleSync, { once: true });
  window.addEventListener('resize', scheduleSync, { passive: true });
  document.addEventListener('change', scheduleSync, true);
  document.addEventListener('click', function (event) {
    if (event.target && event.target.closest('.month-filter, .month-actions, .month-checks')) {
      scheduleSync();
    }
  }, true);

  const observer = new MutationObserver(function (records) {
    if (records.some(function (record) {
      return record.type === 'childList' ||
        (record.type === 'attributes' && record.attributeName === 'hidden');
    })) scheduleSync();
  });
  if (document.body) {
    observer.observe(document.body, {
      subtree: true,
      childList: true,
      attributes: true,
      attributeFilter: ['hidden']
    });
  } else {
    document.addEventListener('DOMContentLoaded', function () {
      observer.observe(document.body, {
        subtree: true,
        childList: true,
        attributes: true,
        attributeFilter: ['hidden']
      });
    }, { once: true });
  }
})();


async function downloadCanvasAsPng(canvas, fileName){
  return new Promise((resolve,reject)=>{
    canvas.toBlob(blob=>{
      if(!blob){reject(new Error('PNG tidak dapat dibuat.')) ;return;}
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url;a.download=fileName;
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),2000);
      resolve();
    },'image/png');
  });
}

function screenshotScale(width,height){
  const maxSide=12000;
  const maxPixels=80000000;
  return Math.max(0.55,Math.min(2,maxSide/Math.max(width,1),maxSide/Math.max(height,1),Math.sqrt(maxPixels/Math.max(width*height,1))));
}

async function captureMatrixPng(button){
  const panel=button&&button.closest('.panel.matrix');
  let clone=null;
  if(!panel){alert('Kotak matrix tidak ditemukan.');return;}
  if(typeof html2canvas!=='function'){alert('Fitur screenshot belum termuat. Periksa koneksi internet lalu refresh dashboard.');return;}
  const oldText=button.innerHTML;
  button.disabled=true;button.setAttribute('aria-busy','true');
  try{
    const sourceTables=Array.from(panel.querySelectorAll('.tablewrap table'));
    const sourceWidth=Math.max(panel.scrollWidth,panel.getBoundingClientRect().width,...sourceTables.map(t=>t.scrollWidth||t.getBoundingClientRect().width));
    clone=panel.cloneNode(true);
    clone.querySelectorAll('.matrix-actions').forEach(el=>el.remove());
    clone.style.cssText += ';position:fixed!important;left:-20000px!important;top:0!important;width:'+Math.ceil(sourceWidth+40)+'px!important;max-width:none!important;height:auto!important;max-height:none!important;overflow:visible!important;z-index:-1!important;background:#fff!important;contain:none!important;';
    const wraps=Array.from(clone.querySelectorAll('.tablewrap'));
    wraps.forEach((wrap,i)=>{
      const src=panel.querySelectorAll('.tablewrap')[i];
      const fullWidth=Math.max(src?src.scrollWidth:0,src?src.querySelector('table')?.scrollWidth||0:0,sourceWidth);
      wrap.style.cssText += ';display:block!important;position:static!important;width:'+Math.ceil(fullWidth)+'px!important;min-width:'+Math.ceil(fullWidth)+'px!important;max-width:none!important;height:auto!important;max-height:none!important;overflow:visible!important;contain:none!important;';
    });
    const tables=Array.from(clone.querySelectorAll('.tablewrap table'));
    tables.forEach((table,i)=>{
      const src=sourceTables[i];
      const w=Math.max(src?src.scrollWidth:0,src?src.getBoundingClientRect().width:0,table.scrollWidth||0);
      table.style.cssText += ';display:table!important;position:static!important;width:'+Math.ceil(w)+'px!important;min-width:'+Math.ceil(w)+'px!important;max-width:none!important;height:auto!important;max-height:none!important;table-layout:auto!important;border-collapse:separate!important;';
      table.querySelectorAll('th,td').forEach(cell=>{
        cell.style.setProperty('position','static','important');
        ['left','right','top','bottom'].forEach(p=>cell.style.removeProperty(p));
      });
    });
    document.body.appendChild(clone);
    await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
    const width=Math.ceil(Math.max(clone.scrollWidth,clone.getBoundingClientRect().width));
    const height=Math.ceil(Math.max(clone.scrollHeight,clone.getBoundingClientRect().height));
    const scale=screenshotScale(width,height);
    const canvas=await html2canvas(clone,{scale,backgroundColor:'#ffffff',useCORS:true,logging:false,width,height,windowWidth:Math.max(document.documentElement.clientWidth,width),windowHeight:Math.max(document.documentElement.clientHeight,height),scrollX:0,scrollY:0});
    clone.remove();clone=null;
    const heading=panel.querySelector('h3')?.textContent||'Matrix';
    const safeName=heading.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
    const stamp=new Date().toISOString().slice(0,10);
    await downloadCanvasAsPng(canvas,(safeName||'matrix')+'_'+stamp+'.png');
  }catch(err){
    if(clone&&clone.isConnected)clone.remove();
    console.error('Screenshot matrix gagal:',err);
    alert('Screenshot matrix gagal dibuat: '+(err&&err.message?err.message:String(err)));
  }finally{
    button.disabled=false;button.removeAttribute('aria-busy');button.innerHTML=oldText;
  }
}

async function captureDashboardSummaryPng(button){
  const source=document.querySelector('main.wrap');
  let clone=null;
  if(!source){alert('Area ringkasan dashboard tidak ditemukan.');return;}
  if(typeof html2canvas!=='function'){alert('Fitur screenshot belum termuat. Periksa koneksi internet lalu refresh dashboard.');return;}
  const oldText=button.innerHTML;
  button.disabled=true;button.setAttribute('aria-busy','true');
  try{
    clone=source.cloneNode(true);
    clone.querySelectorAll('.panel.matrix,.section-title,.footer,.lower').forEach(el=>el.remove());
    clone.querySelectorAll('.month-menu').forEach(el=>el.remove());
    /* Preserve the selected filter labels and copy live Chart.js canvas pixels. */
    const sourceCanvases=Array.from(source.querySelectorAll('canvas'));
    const cloneCanvases=Array.from(clone.querySelectorAll('canvas'));
    sourceCanvases.forEach((src,i)=>{
      const dst=cloneCanvases[i];
      if(!dst)return;
      dst.width=src.width;dst.height=src.height;
      try{dst.getContext('2d').drawImage(src,0,0);}catch(e){}
    });
    const width=Math.ceil(source.getBoundingClientRect().width);
    clone.style.cssText += ';position:fixed!important;left:-20000px!important;top:0!important;width:'+width+'px!important;max-width:none!important;height:auto!important;max-height:none!important;overflow:visible!important;z-index:-1!important;background:#f4f7fb!important;';
    clone.querySelectorAll('.chartbox,.chartbox canvas').forEach(el=>{el.style.setProperty('overflow','visible','important');el.style.setProperty('max-height','none','important');});
    document.body.appendChild(clone);
    await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
    const w=Math.ceil(Math.max(clone.scrollWidth,clone.getBoundingClientRect().width));
    const h=Math.ceil(Math.max(clone.scrollHeight,clone.getBoundingClientRect().height));
    const scale=screenshotScale(w,h);
    const canvas=await html2canvas(clone,{scale,backgroundColor:'#f4f7fb',useCORS:true,logging:false,width:w,height:h,windowWidth:Math.max(document.documentElement.clientWidth,w),windowHeight:Math.max(document.documentElement.clientHeight,h),scrollX:0,scrollY:0});
    clone.remove();clone=null;
    const stamp=new Date().toISOString().slice(0,10);
    await downloadCanvasAsPng(canvas,'sales_performance_dashboard_'+stamp+'.png');
  }catch(err){
    if(clone&&clone.isConnected)clone.remove();
    console.error('Screenshot dashboard gagal:',err);
    alert('Screenshot dashboard gagal dibuat: '+(err&&err.message?err.message:String(err)));
  }finally{
    button.disabled=false;button.removeAttribute('aria-busy');button.innerHTML=oldText;
  }
}
