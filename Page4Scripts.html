<script>
let p4Meta=null,p4Data=null,p4DataSO=null,p4InitBusy=false,p4Request=0,p4Year=0;
const p4$=id=>document.getElementById(id),p4Num=v=>Number(v||0),p4Esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p4Fmt=v=>p4Num(v).toLocaleString('id-ID',{maximumFractionDigits:1}),p4FmtValue=v=>p4Num(v).toLocaleString('id-ID',{maximumFractionDigits:0});
function p4Selected(id){return [...(p4$(id)?.querySelectorAll('input:checked')||[])].map(x=>x.value)}
function p4SelectedFilter(id){const s=p4Selected(id),n=p4$(id)?.querySelectorAll('input[type="checkbox"]').length||0;return !s.length||s.length===n?[]:s}
function p4Fill(id,values){p4$(id).innerHTML=(values||[]).map(v=>'<label class="p4-checkitem"><input type="checkbox" value="'+p4Esc(v)+'" checked><span>'+p4Esc(v)+'</span></label>').join('');p4UpdateTrigger(id)}
function p4UpdateTrigger(id){const s=p4Selected(id),n=p4$(id)?.querySelectorAll('input').length||0,labels={p4Customers:'Customer',p4Subdists:'Entitas',p4Months:'Bulan',p4Dates:'Tanggal',p4Pics:'PIC',p4Brands:'Brand',p4Subbrands:'Subbrand',p4Categories:'Category'},label=labels[id]||'Pilihan';p4$(id+'Trigger').textContent=!s.length||s.length===n?'Semua '+label:s.length===1?s[0]:s.length+' dipilih'}
function p4RenderSubdist(){p4Fill('p4Subdists',p4Meta?.subdists||[]);p4UpdateTrigger('p4Subdists')}
function p4RenderFilters(){
 p4Fill('p4Customers',p4Meta.customers||[]);p4RenderSubdist();p4Fill('p4Pics',p4Meta.pics||[]);p4Fill('p4Brands',p4Meta.brands||[]);p4Fill('p4Subbrands',p4Meta.subbrands||[]);p4Fill('p4Categories',p4Meta.categories||[]);
 const years=(p4Meta.years||[]).map(Number);p4Year=years.includes(2026)?2026:(years[years.length-1]||0);
 p4$('p4Years').innerHTML=years.map(y=>'<label class="p4-checkitem"><input type="radio" name="p4YearChoice" value="'+y+'" '+(y===p4Year?'checked':'')+'><span>'+y+'</span></label>').join('');
 p4$('p4YearTrigger').textContent=p4Year?String(p4Year):'Pilih Tahun';
 p4Fill('p4Months',p4Meta.monthsByYear?.[String(p4Year)]||[]);p4SetDateDefaults();p4UpdateMonthsTrigger();
}
function p4UpdateMonthsTrigger(){p4UpdateTrigger('p4Months')}
function p4SetDateDefaults(){const months=p4Selected('p4Months'),order=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'],keys=(p4Meta?.dateKeys||[]).filter(k=>k.startsWith(String(p4Year)+'-')&&(!months.length||months.includes(order[Number(k.slice(5,7))-1]))),max=keys.length?Math.max(...keys.map(k=>Number(k.slice(8,10)))):0,box=p4$('p4Dates');if(!box)return;box.innerHTML='';for(let d=1;d<=31;d++){const v=String(d).padStart(2,'0');box.insertAdjacentHTML('beforeend','<label class="p4-checkitem"><input type="checkbox" value="'+v+'" '+(d<=max?'checked':'')+'><span>'+v+'</span></label>')}p4UpdateTrigger('p4Dates')}
function p4Filters(mode){return {mode:mode,year:p4Year,months:p4SelectedFilter('p4Months'),dates:p4SelectedFilter('p4Dates'),pics:p4SelectedFilter('p4Pics'),brands:p4SelectedFilter('p4Brands'),subbrands:p4SelectedFilter('p4Subbrands'),categories:p4SelectedFilter('p4Categories'),customers:p4SelectedFilter('p4Customers'),subdists:p4SelectedFilter('p4Subdists')}}
function p4Busy(b,label){const v=p4$('p4View');if(b){v.setAttribute('aria-busy','true');const t=p4$('p4LoadingText');if(t&&label)t.textContent=label;}else v.removeAttribute('aria-busy')}
function page4Init(){if(p4Meta||p4InitBusy)return;p4InitBusy=true;p4Busy(true,'Memuat data SO dan SOO dari P34_EVENT_FACT...');p4$('p4Status').textContent='Memuat P34_EVENT_FACT dan master SKU...';google.script.run.withSuccessHandler(x=>{p4InitBusy=false;p4Busy(false);if(!x?.meta||!x?.data||!x?.dataSO){p4$('p4Status').textContent='Payload Page 4 tidak lengkap.';return}p4Meta=x.meta;p4RenderFilters();p4Data=x.data;p4DataSO=x.dataSO;p4Render();p4$('p4Status').textContent='Sumber '+x.diagnostics.source+' • '+p4Fmt(p4Meta.sourceRows)+' baris sumber • Server '+p4Fmt(x.diagnostics.totalMs)+' ms (baca '+p4Fmt(x.diagnostics.readMs)+' • metadata '+p4Fmt(x.diagnostics.metaMs)+' • agregasi '+p4Fmt(x.diagnostics.aggregateMs)+' ms)'}).withFailureHandler(e=>{p4InitBusy=false;p4Busy(false);p4$('p4Status').textContent='Gagal memuat Page 4: '+(e.message||e)}).getPage4InitialPayload('SOO')}
function page4Apply(){if(!p4Meta)return;const seq=++p4Request,clientStarted=Date.now();let left=2,results={};p4Busy(true,'Menerapkan filter SO dan SOO...');p4$('p4Status').textContent='Menghitung dua tabel dari P34_EVENT_FACT...';const done=(mode,data)=>{if(seq!==p4Request)return;results[mode]=data;if(--left)return;p4DataSO=results.SO;p4Data=results.SOO;p4Render();const d=results.SOO.diagnostics||{};p4$('p4Status').textContent='SO '+p4Fmt(results.SO.skuCount)+' SKU • SOO '+p4Fmt(results.SOO.skuCount)+' SKU • '+(d.source||'P34_EVENT_FACT')+' • Respon '+((Date.now()-clientStarted)/1000).toFixed(1)+' detik • Server '+p4Fmt(d.totalMs)+' ms';p4Busy(false)};['SO','SOO'].forEach(mode=>google.script.run.withSuccessHandler(d=>done(mode,d)).withFailureHandler(e=>{if(seq!==p4Request)return;p4Busy(false);p4$('p4Status').textContent='Gagal memuat tabel '+mode+': '+(e.message||e)}).getPage4SkuData(p4Filters(mode)))}
function p4RenderOne(data,tableId,mode){
 const table=p4$(tableId);if(!table||!data)return;const months=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
 const heads=['BRAND / SKU',...months.map(m=>m.slice(0,3)),'AVG 3M (VAL)','AVG 6M (VAL)','CTR','GRW vs LY','GRW vs LM','GRW vs L3M','STOCK','DOI','BDP','DOI AKHIR','SARAN PO'];
 table.querySelector('thead').innerHTML='<tr>'+heads.map(x=>'<th>'+x+'</th>').join('')+'</tr>';
 const brands=new Map();(data.rows||[]).forEach(r=>{const b=r.brand||'(BRAND KOSONG)';if(!brands.has(b))brands.set(b,[]);brands.get(b).push(r)});
 const total=p4Num(data.totals?.value),rows=[];
 const blank='<td class="p4-na">—</td>';
 const money=v=>'<td>'+p4FmtValue(v)+'</td>';
 for(const [brand,items] of [...brands.entries()].sort((a,b)=>a[0].localeCompare(b[0],'id'))){
  const sumMonth=months.map((m,i)=>items.reduce((a,r)=>a+p4Num(r.months?.[i]),0)),sum=sumMonth.reduce((a,v)=>a+v,0),avg3=items.reduce((a,r)=>a+p4Num(r.avg3),0),avg6=items.reduce((a,r)=>a+p4Num(r.avg6),0),id='p4-'+mode+'-'+rows.length;
  rows.push('<tr class="p4-brand-row" data-brand="'+id+'" onclick="p4ToggleBrand(\''+id+'\')"><td><b>＋ '+p4Esc(brand)+'</b> <small>('+items.length+' SKU)</small></td>'+sumMonth.map(money).join('')+money(avg3)+money(avg6)+'<td>'+(total?((sum/total)*100).toFixed(1)+'%':'—')+'</td>'+blank.repeat(8)+'</tr>');
  items.sort((a,b)=>b.totalValue-a.totalValue||a.sku.localeCompare(b.sku,'id')).forEach(r=>rows.push('<tr class="p4-sku-row '+id+'" hidden><td class="p4-sku-indent">↳ '+p4Esc(r.sku)+'</td>'+months.map((m,i)=>money(r.months?.[i])).join('')+money(r.avg3)+money(r.avg6)+'<td>'+(total?((r.totalValue/total)*100).toFixed(2)+'%':'—')+'</td>'+blank.repeat(8)+'</tr>'));
 }
 const totalsMonth=months.map((m,i)=>(data.rows||[]).reduce((a,r)=>a+p4Num(r.months?.[i]),0));
 rows.push('<tr class="p4-total"><td>GRAND TOTAL</td>'+totalsMonth.map(money).join('')+money((data.rows||[]).reduce((a,r)=>a+p4Num(r.avg3),0))+money((data.rows||[]).reduce((a,r)=>a+p4Num(r.avg6),0))+'<td>100%</td>'+blank.repeat(8)+'</tr>');
 table.querySelector('tbody').innerHTML=rows.join('');
}
function p4ToggleBrand(id){const rows=document.querySelectorAll('.'+id);const hide=[...rows].some(r=>r.hidden);rows.forEach(r=>r.hidden=!hide);const head=document.querySelector('[data-brand="'+id+'"]');if(head){const b=head.querySelector('b');if(b)b.textContent=(hide?'－ ':'＋ ')+b.textContent.replace(/^[＋－] /,'')}}
function p4Render(){if(!p4Data||!p4DataSO)return;p4$('p4SkuCount').textContent=p4Fmt(Math.max(p4Data.skuCount,p4DataSO.skuCount));p4$('p4TotalValueSO').textContent=p4FmtValue(p4DataSO.totals.value);p4$('p4TotalValueSOO').textContent=p4FmtValue(p4Data.totals.value);p4$('p4TableInfoSO').textContent=p4DataSO.year+' • '+(p4DataSO.monthsUsed||[]).join(', ')+' • SUB_DIST';p4$('p4TableInfoSOO').textContent=p4Data.year+' • '+(p4Data.monthsUsed||[]).join(', ')+' • SUBDIST';p4RenderOne(p4DataSO,'p4SkuTableSO','SO');p4RenderOne(p4Data,'p4SkuTableSOO','SOO')}
function page4Show(){mantulShowPage_('p4View');if(!p4Meta)page4Init()}
document.addEventListener('click',e=>{
 const root=p4$('p4View');if(!root)return;
 const trigger=e.target.closest('#p4View .p4-trigger');
 if(trigger){const f=trigger.closest('.p4-filter'),was=f.classList.contains('open');root.querySelectorAll('.p4-filter.open').forEach(x=>x.classList.remove('open'));if(!was)f.classList.add('open');return;}
 const action=e.target.closest('#p4View .p4-menu-actions [data-action]');
 if(action){e.preventDefault();e.stopPropagation();const f=action.closest('.p4-filter'),a=action.dataset.action;
  if(a==='all'||a==='reset'){p4$(action.dataset.target)?.querySelectorAll('input[type="checkbox"]').forEach(x=>x.checked=a==='all');p4UpdateTrigger(action.dataset.target);return;}
  if(a==='year-apply'){const selected=p4$('p4Years').querySelector('input:checked');if(selected)p4Year=Number(selected.value);p4$('p4YearTrigger').textContent=String(p4Year);p4Fill('p4Months',p4Meta.monthsByYear?.[String(p4Year)]||[]);p4SetDateDefaults();p4UpdateMonthsTrigger();f?.classList.remove('open');page4Apply();return;}
  if(a==='apply'){f?.classList.remove('open');['p4Customers','p4Subdists','p4Months','p4Dates','p4Pics','p4Brands','p4Subbrands','p4Categories'].forEach(p4UpdateTrigger);page4Apply();return;}
 }
 if(!e.target.closest('#p4View .p4-filter'))root.querySelectorAll('.p4-filter.open').forEach(x=>x.classList.remove('open'));
});
document.addEventListener('change',e=>{if(e.target.closest('#p4View .p4-checklist')){['p4Customers','p4Subdists','p4Months','p4Dates','p4Pics','p4Brands','p4Subbrands','p4Categories'].forEach(p4UpdateTrigger);if(e.target.closest('#p4Months'))p4SetDateDefaults()}})
document.addEventListener('input',e=>{const id=e.target.dataset.search;if(id){const q=e.target.value.toLowerCase();if(p4$(id))p4$(id).querySelectorAll('.p4-checkitem').forEach(x=>x.hidden=!!q&&!x.textContent.toLowerCase().includes(q))}})
</script>
