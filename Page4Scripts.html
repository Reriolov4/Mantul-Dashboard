<script>
let p4Meta=null,p4Data=null,p4Subdist='ALL',p4InitBusy=false,p4Request=0;
const p4$=id=>document.getElementById(id),p4Num=v=>Number(v||0);
const p4Esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p4Fmt=v=>p4Num(v).toLocaleString('id-ID',{maximumFractionDigits:1}),p4FmtValue=v=>p4Num(v).toLocaleString('id-ID',{maximumFractionDigits:0});
function p4Busy(b){const el=p4$('p4View');if(el){if(b)el.setAttribute('aria-busy','true');else el.removeAttribute('aria-busy');}}
function p4RenderSubdists(){const opts=['ALL',...(p4Meta?.subdists||[])];p4$('p4SubdistPills').innerHTML=opts.map(v=>'<button type="button" data-subdist="'+p4Esc(v)+'" class="'+(v===p4Subdist?'active':'')+'">'+(v==='ALL'?'SEMUA':p4Esc(v))+'</button>').join('');}
function p4RenderFilters(){p4$('p4Year').innerHTML=(p4Meta.years||[]).map(y=>'<option>'+p4Esc(y)+'</option>').join('');p4$('p4Year').value=(p4Meta.years||[]).includes('2026')?'2026':(p4Meta.years||[]).slice(-1)[0]||'';p4RenderSubdists();}
function p4Filters(){return {mode:p4$('p4SalesMode').value,year:p4$('p4Year').value,subdists:p4Subdist==='ALL'?[]:[p4Subdist]};}
function page4Init(){if(p4Meta||p4InitBusy)return;p4InitBusy=true;p4Busy(true);p4$('p4Status').textContent='Membaca P2_EVENT_INDEX dan master SKU...';google.script.run.withSuccessHandler(x=>{p4InitBusy=false;p4Busy(false);if(!x||!x.meta||!x.data){p4$('p4Status').textContent='Payload Page 4 tidak lengkap.';return;}p4Meta=x.meta;p4RenderFilters();p4Data=x.data;p4Render();p4$('p4Status').textContent='Sumber '+x.diagnostics.source+' • '+p4Fmt(p4Meta.sooRows)+' baris SOO • '+p4Fmt(p4Meta.soModeRows)+' baris untuk mode SO • '+p4Fmt(p4Meta.skuMasterCount)+' SKU master';}).withFailureHandler(e=>{p4InitBusy=false;p4Busy(false);p4$('p4Status').textContent='Gagal memuat Page 4: '+(e.message||e);}).getPage4InitialPayload('SOO');}
function page4Apply(){if(!p4Meta)return;const seq=++p4Request;p4Busy(true);p4$('p4Status').textContent='Menghitung SKU '+p4$('p4SalesMode').value+'...';google.script.run.withSuccessHandler(d=>{if(seq!==p4Request)return;p4Data=d;p4Render();p4$('p4Status').textContent=p4Fmt(d.skuCount)+' SKU • '+p4Fmt(d.matchedSourceRows)+' baris transaksi • Jenis Sales: '+d.modeSalesType;p4Busy(false);}).withFailureHandler(e=>{if(seq!==p4Request)return;p4Busy(false);p4$('p4Status').textContent='Gagal menerapkan filter: '+(e.message||e);}).getPage4SkuData(p4Filters());}
function p4Render(){if(!p4Data)return;const d=p4Data,t=p4$('p4SkuTable');p4$('p4SkuCount').textContent=p4Fmt(d.skuCount);p4$('p4TotalValue').textContent=p4FmtValue(d.totals.value);p4$('p4TotalCarton').textContent=p4Fmt(d.totals.carton);p4$('p4TableInfo').textContent=d.mode+' • '+d.year+' YTD • '+(d.monthsUsed||[]).join(', ')+' • '+d.subdist;t.querySelector('thead').innerHTML='<tr><th>SKU KCH</th><th>BRAND</th><th>SUBBRAND</th><th>CATEGORY</th><th>ENTITAS</th><th>VALUE</th><th>KARTON</th></tr>';t.querySelector('tbody').innerHTML=(d.rows||[]).map(r=>'<tr><td title="'+p4Esc(r.sku)+'">'+p4Esc(r.sku)+'</td><td>'+p4Esc(r.brand)+'</td><td>'+p4Esc(r.subbrand)+'</td><td>'+p4Esc(r.category)+'</td><td>'+p4Esc(r.entity)+'</td><td>'+p4FmtValue(r.total.value)+'</td><td>'+p4Fmt(r.total.carton)+'</td></tr>').join('')+'<tr class="p4-total"><td>GRAND TOTAL</td><td></td><td></td><td></td><td></td><td>'+p4FmtValue(d.totals.value)+'</td><td>'+p4Fmt(d.totals.carton)+'</td></tr>';}
function page4Reset(){if(!p4Meta)return;p4$('p4Year').value=p4Meta.years.includes('2026')?'2026':p4Meta.years.slice(-1)[0];p4Subdist='ALL';p4RenderSubdists();page4Apply();}
function page4Show(){mantulShowPage_('p4View');if(!p4Meta)page4Init();}
document.addEventListener('click',e=>{const sd=e.target.closest('#p4SubdistPills button');if(sd){p4Subdist=sd.dataset.subdist;p4RenderSubdists();page4Apply();}if(e.target.id==='p4Apply')page4Apply();if(e.target.id==='p4Reset')page4Reset();});
p4$('p4Year')?.addEventListener('change',page4Apply);p4$('p4SalesMode')?.addEventListener('change',()=>{p4Subdist='ALL';p4RenderSubdists();page4Apply();});
</script>
