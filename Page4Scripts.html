const p4CenterText={id:'p4CenterText',afterDraw(chart){if(chart.config.type!=='doughnut')return;const total=(chart.data.datasets[0]?.data||[]).reduce((a,b)=>a+Number(b||0),0);const ctx=chart.ctx,area=chart.chartArea;if(!area)return;ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#64748b';ctx.font='600 10px Inter, Segoe UI, Arial, sans-serif';ctx.fillText(p4MetricValue==='ao'?'TOTAL AO':p4MetricValue==='ec'?'TOTAL EC':'TOTAL VALUE', (area.left+area.right)/2,(area.top+area.bottom)/2-9);ctx.fillStyle='#172b4d';ctx.font='800 19px Inter, Segoe UI, Arial, sans-serif';ctx.fillText(p4FmtMetric(total),(area.left+area.right)/2,(area.top+area.bottom)/2+11);ctx.restore();}};

function p4Chart(id,type,data,options){if(p4Charts[id])p4Charts[id].destroy();const ctx=p4$(id);const defaults={responsive:true,maintainAspectRatio:false,font:{family:'Inter, Segoe UI, Arial, sans-serif'},plugins:{legend:{display:type!=='doughnut',position:'bottom',labels:{boxWidth:10,font:{size:9}}}},scales:type==='doughnut'?{}:{y:{beginAtZero:true,grid:{display:false,drawBorder:false},ticks:{font:{size:9}}},x:{grid:{display:false,drawBorder:false},ticks:{font:{size:9},maxRotation:0,minRotation:0}}}};p4Charts[id]=new Chart(ctx,{type,data,options:Object.assign(defaults,options||{}),plugins:type==='doughnut'?[p4CenterText]:[p4ValueLabels]});}
function p4RenderDonut(key,canvasId,legendId){

 legend.innerHTML=arr.map((x,i)=>{const share=total?Number(x[metric])/total*100:0;const growth=metric==='value'?x.valueGrowth:x.growth;const cls=growth===null||growth===undefined?'neu':growth>0?'pos':growth<0?'neg':'neu';return `<div class="p4-donut-row"><div class="p4-donut-name" style="color:${colors[i]}">${p4Esc(x.name)}</div><div class="p4-donut-meta"><span class="p4-donut-share">${share.toFixed(1)}% • ${p4FmtMetric(x[metric],metric)}${metric==='value'?'':' '+metric.toUpperCase()}</span><span class="p4-donut-growth ${cls}">${p4Growth(growth)}</span></div></div>`;}).join('');

function page4RenderChartInsights(){
 const d=p4Data,k=d.kpi,metric=p4MetricValue,order=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
 const lastIndex=order.indexOf(k.mtdMonth),ytdMonths=lastIndex>=0?order.slice(0,lastIndex+1):[];
