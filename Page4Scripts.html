<script>
let p4Meta=null,p4Data=null,p4InitBusy=false,p4Request=0,p4Year=0;
const p4$=id=>document.getElementById(id),p4Num=v=>Number(v||0),p4Esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p4Fmt=v=>p4Num(v).toLocaleString('id-ID',{maximumFractionDigits:1}),p4FmtValue=v=>p4Num(v).toLocaleString('id-ID',{maximumFractionDigits:0});
function p4Selected(id){return [...(p4$(id)?.querySelectorAll('input:checked')||[])].map(x=>x.value)}
function p4SelectedFilter(id){const s=p4Selected(id),n=p4$(id)?.querySelectorAll('input[type="checkbox"]').length||0;return !s.length||s.length===n?[]:s}
function p4Fill(id,values){p4$(id).innerHTML=(values||[]).map(v=>'<label class="p4-checkitem"><input type="checkbox" value="'+p4Esc(v)+'" checked><span>'+p4Esc(v)+'</span></label>').join('');p4UpdateTrigger(id)}
function p4UpdateTrigger(id){const s=p4Selected(id),n=p4$(id)?.querySelectorAll('input').length||0,label=id==='p4Customers'?'Customer':'SUBDIST';p4$(id+'Trigger').textContent=!s.length||s.length===n?'Semua '+label:s.length===1?s[0]:s.length+' dipilih'}
function p4RenderSubdist(){p4Fill('p4Subdists',p4Meta?.subdists||[]);p4UpdateTrigger('p4Subdists')}
function p4RenderFilters(){
 p4Fill('p4Customers',p4Meta.customers||[]);p4RenderSubdist();p4Fill('p4Pics',p4Meta.pics||[]);p4Fill('p4Brands',p4Meta.brands||[]);p4Fill('p4Subbrands',p4Meta.subbrands||[]);p4Fill('p4Categories',p4Meta.categories||[]);
 const years=(p4Meta.years||[]).map(Number);p4Year=years.includes(2026)?2026:(years[years.length-1]||0);
 p4$('p4Years').innerHTML=years.map(y=>'<label class="p4-checkitem"><input type="radio" name="p4YearChoice" value="'+y+'" '+(y===p4Year?'checked':'')+'><span>'+y+'</span></label>').join('');
 p4$('p4YearTrigger').textContent=p4Year?String(p4Year):'Pilih Tahun';
 p4Fill('p4Months',p4Meta.monthsByYear?.[String(p4Year)]||[]);p4SetDateDefaults();p4UpdateMonthsTrigger();
}
function p4UpdateMonthsTrigger(){p4UpdateTrigger('p4Months')}
function p4SetDateDefaults(){const months=p4Selected('p4Months'),order=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'],keys=(p4Meta?.dateKeys||[]).filter(k=>k.startsWith(String(p4Year)+'-')&&(!months.length||months.includes(order[Number(k.slice(5,7))-1]))),max=keys.length?Math.max(...keys.map(k=>Number(k.slice(8,10)))):0,box=p4$('p4Dates');if(!box)return;box.innerHTML='';for(let d=1;d<=31;d++){const v=String(d).padStart(2,'0');box.insertAdjacentHTML('beforeend','<label class="p4-checkitem"><input type="checkbox" value="'+v+'" '+(d<=max?'checked':'')+'><span>'+v+'</span></label>')}p4UpdateTrigger('p4Dates')}
function p4Filters(){return {year:p4Year,months:p4SelectedFilter('p4Months'),dates:p4SelectedFilter('p4Dates'),pics:p4SelectedFilter('p4Pics'),brands:p4SelectedFilter('p4Brands'),subbrands:p4SelectedFilter('p4Subbrands'),categories:p4SelectedFilter('p4Categories'),customers:p4SelectedFilter('p4Customers'),subdists:p4SelectedFilter('p4Subdists')}}
function p4Busy(b,label){const v=p4$('p4View');if(b){v.setAttribute('aria-busy','true');const t=p4$('p4LoadingText');if(t&&label)t.textContent=label;}else v.removeAttribute('aria-busy')}
function page4Init(){if(p4Meta||p4InitBusy)return;p4InitBusy=true;p4Busy(true,'Memuat data SKU dan menyiapkan master produk...');p4$('p4Status').textContent='Memuat P34_EVENT_FACT dan master SKU...';google.script.run.withSuccessHandler(x=>{p4InitBusy=false;p4Busy(false);if(!x?.meta||!x?.data){p4$('p4Status').textContent='Payload Page 4 tidak lengkap.';return}p4Meta=x.meta;p4RenderFilters();p4Data=x.data;p4Render();p4$('p4Status').textContent='Sumber '+x.diagnostics.source+' • '+p4Fmt(p4Meta.sooRows)+' baris SOO • Server '+p4Fmt(x.diagnostics.totalMs)+' ms (baca '+p4Fmt(x.diagnostics.readMs)+' • metadata '+p4Fmt(x.diagnostics.metaMs)+' • agregasi '+p4Fmt(x.diagnostics.aggregateMs)+' ms)'}).withFailureHandler(e=>{p4InitBusy=false;p4Busy(false);p4$('p4Status').textContent='Gagal memuat Page 4: '+(e.message||e)}).getPage4InitialPayload('SOO')}
function page4Apply(){if(!p4Meta)return;const seq=++p4Request,clientStarted=Date.now();p4Busy(true,'Menerapkan filter dan menghitung ulang SKU...');p4$('p4Status').textContent='Menerapkan filter dari P34_EVENT_FACT...';google.script.run.withSuccessHandler(d=>{if(seq!==p4Request)return;p4Data=d;p4Render();p4$('p4Status').textContent=p4Fmt(d.skuCount)+' SKU • '+p4Fmt(d.matchedSourceRows)+' baris transaksi • '+(d.diagnostics?.source||'P34_EVENT_FACT')+' • Respon '+((Date.now()-clientStarted)/1000).toFixed(1)+' detik • Server '+p4Fmt(d.diagnostics?.totalMs)+' ms (baca '+p4Fmt(d.diagnostics?.readMs)+' • metadata '+p4Fmt(d.diagnostics?.metaMs)+' • agregasi '+p4Fmt(d.diagnostics?.aggregateMs)+' ms)';p4Busy(false)}).withFailureHandler(e=>{if(seq!==p4Request)return;p4Busy(false);p4$('p4Status').textContent='Gagal menerapkan filter: '+(e.message||e)}).getPage4SkuData(p4Filters())}
function p4Render(){if(!p4Data)return;const d=p4Data,t=p4$('p4SkuTable');p4$('p4SkuCount').textContent=p4Fmt(d.skuCount);p4$('p4TotalValue').textContent=p4FmtValue(d.totals.value);p4$('p4TotalCarton').textContent=p4Fmt(d.totals.carton);p4$('p4TableInfo').textContent=d.year+' • '+(d.monthsUsed||[]).join(', ')+' • '+(d.subdist||'Semua SUBDIST');t.querySelector('thead').innerHTML='<tr><th>SKU KCH</th><th>BRAND</th><th>SUBBRAND</th><th>CATEGORY</th><th>ENTITAS</th><th>VALUE</th><th>KARTON</th></tr>';t.querySelector('tbody').innerHTML=(d.rows||[]).map(r=>'<tr><td title="'+p4Esc(r.sku)+'">'+p4Esc(r.sku)+'</td><td>'+p4Esc(r.brand)+'</td><td>'+p4Esc(r.subbrand)+'</td><td>'+p4Esc(r.category)+'</td><td>'+p4Esc(r.entity)+'</td><td>'+p4FmtValue(r.total.value)+'</td><td>'+p4Fmt(r.total.carton)+'</td></tr>').join('')+'<tr class="p4-total"><td>GRAND TOTAL</td><td></td><td></td><td></td><td></td><td>'+p4FmtValue(d.totals.value)+'</td><td>'+p4Fmt(d.totals.carton)+'</td></tr>'}
function page4Show(){mantulShowPage_('p4View');if(!p4Meta)page4Init()}
document.addEventListener('click',e=>{
 const root=p4$('p4View');if(!root)return;
 const trigger=e.target.closest('#p4View .p4-trigger');
 if(trigger){const f=trigger.closest('.p4-filter'),was=f.classList.contains('open');root.querySelectorAll('.p4-filter.open').forEach(x=>x.classList.remove('open'));if(!was)f.classList.add('open');return;}
 const action=e.target.closest('#p4View .p4-menu-actions [data-action]');
 if(action){e.preventDefault();e.stopPropagation();const f=action.closest('.p4-filter'),a=action.dataset.action;
  if(a==='all'||a==='reset'){p4$(action.dataset.target)?.querySelectorAll('input[type="checkbox"]').forEach(x=>x.checked=a==='all');p4UpdateTrigger(action.dataset.target);return;}
  if(a==='year-apply'){const selected=p4$('p4Years').querySelector('input:checked');if(selected)p4Year=Number(selected.value);p4$('p4YearTrigger').textContent=String(p4Year);p4Fill('p4Months',p4Meta.monthsByYear?.[String(p4Year)]||[]);p4SetDateDefaults();p4UpdateMonthsTrigger();f?.classList.remove('open');page4Apply();return;}
  if(a==='apply'){f?.classList.remove('open');['p4Customers','p4Subdists','p4Months','p4Dates','p4Pics','p4Brands','p4Subbrands','p4Categories'].forEach(p4UpdateTrigger);page4Apply();return;}
 }
 if(!e.target.closest('#p4View .p4-filter'))root.querySelectorAll('.p4-filter.open').forEach(x=>x.classList.remove('open'));
});
document.addEventListener('change',e=>{if(e.target.closest('#p4View .p4-checklist')){['p4Customers','p4Subdists','p4Months','p4Dates','p4Pics','p4Brands','p4Subbrands','p4Categories'].forEach(p4UpdateTrigger);if(e.target.closest('#p4Months'))p4SetDateDefaults()}})
document.addEventListener('input',e=>{const id=e.target.dataset.search;if(id){const q=e.target.value.toLowerCase();if(p4$(id))p4$(id).querySelectorAll('.p4-checkitem').forEach(x=>x.hidden=!!q&&!x.textContent.toLowerCase().includes(q))}})
</script>
