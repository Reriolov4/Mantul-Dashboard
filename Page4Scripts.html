<script>
let p4Meta=null,p4Data=null,p4DataSO=null,p4InitBusy=false,p4RequestSO=0,p4RequestSOO=0,p4Year=0,p4SubdistSO='ALL',p4SubdistSOO='ALL';
const p4$=id=>document.getElementById(id),p4Num=v=>Number(v||0),p4Esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p4Fmt=v=>p4Num(v).toLocaleString('id-ID',{maximumFractionDigits:1}),p4FmtValue=v=>p4Num(v).toLocaleString('id-ID',{maximumFractionDigits:0});
const p4SOOptions=['EPM LSE','EPM BAC'],p4SOOOptions=['GMP BAC','GMP LSE','GMP LGS','DB MBO','DB BAC'];
function p4Selected(id){return [...(p4$(id)?.querySelectorAll('input:checked')||[])].map(x=>x.value)}
function p4SelectedFilter(id){const s=p4Selected(id),n=p4$(id)?.querySelectorAll('input[type="checkbox"]').length||0;return !s.length||s.length===n?[]:s}
function p4UpdateTrigger(id){const s=p4Selected(id),n=p4$(id)?.querySelectorAll('input').length||0,labels={p4Dates:'Tanggal',p4Pics:'PIC',p4Categories:'Category'},label=labels[id]||'Pilihan';if(p4$(id+'Trigger'))p4$(id+'Trigger').textContent=!s.length||s.length===n?'Semua '+label:s.length===1?s[0]:s.length+' dipilih'}
function p4RenderSubdistTabs(){const render=(id,options,selected)=>{p4$(id).innerHTML=['ALL',...options].map(v=>'<button type="button" data-mode="'+(id.endsWith('SO')?'SO':'SOO')+'" data-subdist="'+p4Esc(v)+'" class="'+(v===selected?'active':'')+'">'+(v==='ALL'?'SEMUA':p4Esc(v))+'</button>').join('')};render('p4SubdistTabsSO',p4SOOptions,p4SubdistSO);render('p4SubdistTabsSOO',p4SOOOptions,p4SubdistSOO)}
function p4RenderFilters(){const fill=(id,values)=>{p4$(id).innerHTML=(values||[]).map(v=>'<label class="p4-checkitem"><input type="checkbox" value="'+p4Esc(v)+'" checked><span>'+p4Esc(v)+'</span></label>').join('');p4UpdateTrigger(id)};fill('p4Pics',p4Meta.pics);fill('p4Categories',p4Meta.categories);const years=(p4Meta.years||[]).map(Number);p4Year=years.includes(2026)?2026:(years[years.length-1]||0);p4$('p4Years').innerHTML=years.map(y=>'<label class="p4-checkitem"><input type="radio" name="p4YearChoice" value="'+y+'" '+(y===p4Year?'checked':'')+'><span>'+y+'</span></label>').join('');p4$('p4YearTrigger').textContent=p4Year?String(p4Year):'Pilih Tahun';p4SetDateDefaults();p4RenderSubdistTabs()}
function p4SetDateDefaults(){const keys=(p4Meta?.dateKeys||[]).filter(k=>k.startsWith(String(p4Year)+'-')),max=keys.length?Math.max(...keys.map(k=>Number(k.slice(8,10)))):0,box=p4$('p4Dates');if(!box)return;box.innerHTML='';for(let d=1;d<=31;d++){const v=String(d).padStart(2,'0');box.insertAdjacentHTML('beforeend','<label class="p4-checkitem"><input type="checkbox" value="'+v+'" '+(d<=max?'checked':'')+'><span>'+v+'</span></label>')}p4UpdateTrigger('p4Dates')}
function p4Filters(mode){const selected=mode==='SO'?p4SubdistSO:p4SubdistSOO;return {mode:mode,year:p4Year,dates:p4SelectedFilter('p4Dates'),pics:p4SelectedFilter('p4Pics'),categories:p4SelectedFilter('p4Categories'),subdists:selected==='ALL'?[]:[selected]}}
function p4Busy(b,label){const v=p4$('p4View');if(b){v.setAttribute('aria-busy','true');const t=p4$('p4LoadingText');if(t&&label)t.textContent=label}else v.removeAttribute('aria-busy')}
function page4Init(){if(p4Meta||p4InitBusy)return;p4InitBusy=true;p4Busy(true,'Memuat data SO dan SOO dari P34_EVENT_FACT...');p4$('p4Status').textContent='Memuat P34_EVENT_FACT dan master SKU...';google.script.run.withSuccessHandler(x=>{p4InitBusy=false;p4Busy(false);if(!x?.meta||!x?.data||!x?.dataSO){p4$('p4Status').textContent='Payload Page 4 tidak lengkap.';return}p4Meta=x.meta;p4RenderFilters();p4Data=x.data;p4DataSO=x.dataSO;p4Render();p4$('p4Status').textContent='Sumber '+x.diagnostics.source+' • '+p4Fmt(p4Meta.sourceRows)+' baris sumber • Server '+p4Fmt(x.diagnostics.totalMs)+' ms (baca '+p4Fmt(x.diagnostics.readMs)+' • metadata '+p4Fmt(x.diagnostics.metaMs)+' • agregasi '+p4Fmt(x.diagnostics.aggregateMs)+' ms)'}).withFailureHandler(e=>{p4InitBusy=false;p4Busy(false);p4$('p4Status').textContent='Gagal memuat Page 4: '+(e.message||e)}).getPage4InitialPayload('SOO')}
function page4ApplyMode(mode){if(!p4Meta)return;const seq=mode==='SO'?++p4RequestSO:++p4RequestSOO,started=Date.now();p4Busy(true,'Menerapkan filter '+mode+' SUBDIST...');google.script.run.withSuccessHandler(data=>{if(seq!==(mode==='SO'?p4RequestSO:p4RequestSOO))return;if(mode==='SO'){p4DataSO=data;p4RenderOne(data,'p4SkuTableSO','SO')}else{p4Data=data;p4RenderOne(data,'p4SkuTableSOO','SOO')}p4$('p4Status').textContent=mode+' SUBDIST • '+p4Fmt(data.skuCount)+' SKU • '+((Date.now()-started)/1000).toFixed(1)+' detik';p4Busy(false)}).withFailureHandler(e=>{p4Busy(false);p4$('p4Status').textContent='Gagal memuat tabel '+mode+': '+(e.message||e)}).getPage4SkuData(p4Filters(mode))}
function page4Apply(){page4ApplyMode('SO');page4ApplyMode('SOO')}
function p4RenderOne(data,tableId,mode){
 const table=p4$(tableId);if(!table||!data)return;const scroll=table.closest('.p4-scroll');if(scroll){scroll.classList.remove('p4-expanded');scroll.style.removeProperty('--p4-initial-height');scroll.style.height='auto';scroll.style.maxHeight='none';}
 const allMonths=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'],months=data.monthsVisible||data.monthsUsed||allMonths,monthIndexes=months.map(m=>allMonths.indexOf(m));
 const heads=['BRAND / SKU',...months,'AVG 3M (VAL)','AVG 6M (VAL)','CTR','GRW vs LY','GRW vs LM','GRW vs L3M','STOCK','DOI','BDP','DOI AKHIR','SARAN PO'];
 table.querySelector('thead').innerHTML='<tr>'+heads.map(x=>'<th>'+x+'</th>').join('')+'</tr>';
 const allRows=data.rows||[],total=p4Num(data.totals?.value),rows=[],blank='<td class="p4-na">—</td>',money=v=>'<td>'+p4FmtValue(v)+'</td>';
 const sbuOrder=['B7','SAKA'],sbuMap=new Map();
 allRows.forEach(r=>{const sbu=String(r.sbu||'LAINNYA').trim().toUpperCase();if(!sbuMap.has(sbu))sbuMap.set(sbu,[]);sbuMap.get(sbu).push(r)});
 const orderedSbu=[...sbuMap.keys()].sort((a,b)=>{const ai=sbuOrder.indexOf(a),bi=sbuOrder.indexOf(b);return (ai<0?99:ai)-(bi<0?99:bi)||a.localeCompare(b,'id')});
 const rank=(a,b)=>b.totalValue-a.totalValue||((total?b.totalValue/total:0)-(total?a.totalValue/total:0))||a.brand.localeCompare(b.brand,'id');
 const brandOrder=items=>{
  const sorted=items.sort(rank),adult=sorted.findIndex(x=>String(x.brand).trim().toUpperCase()==='KOMIX ADULT'),herbal=sorted.findIndex(x=>String(x.brand).trim().toUpperCase()==='KOMIX HERBAL');
  if(adult>=0&&herbal>=0&&herbal!==adult+1){const [item]=sorted.splice(herbal,1);sorted.splice(adult+1,0,item)}
  return sorted;
 };
 for(const sbu of orderedSbu){
  const sbuItems=sbuMap.get(sbu),sbuTotal=sbuItems.reduce((a,r)=>a+p4Num(r.totalValue),0);
  const sbuMonth=monthIndexes.map(i=>sbuItems.reduce((a,r)=>a+p4Num(r.months?.[i]),0));
  const sbuAvg3=sbuItems.reduce((a,r)=>a+p4Num(r.avg3),0),sbuAvg6=sbuItems.reduce((a,r)=>a+p4Num(r.avg6),0);
  const brandMap=new Map();sbuItems.forEach(r=>{const b=r.brand||'(BRAND KOSONG)';if(!brandMap.has(b))brandMap.set(b,[]);brandMap.get(b).push(r)});
  const brands=brandOrder([...brandMap.entries()].map(([brand,items])=>({brand,items,totalValue:items.reduce((a,r)=>a+p4Num(r.totalValue),0)})));
  for(const group of brands){
   const items=group.items,sumMonth=monthIndexes.map(i=>items.reduce((a,r)=>a+p4Num(r.months?.[i]),0)),avg3=items.reduce((a,r)=>a+p4Num(r.avg3),0),avg6=items.reduce((a,r)=>a+p4Num(r.avg6),0),id='p4-'+mode+'-'+rows.length;
   rows.push('<tr class="p4-brand-row" data-brand="'+id+'" onclick="p4ToggleBrand(\''+id+'\')"><td><b>▸ '+p4Esc(group.brand)+'</b> <small>('+items.length+' SKU)</small></td>'+sumMonth.map(money).join('')+money(avg3)+money(avg6)+'<td>'+(total?((group.totalValue/total)*100).toFixed(2)+'%':'—')+'</td>'+blank.repeat(8)+'</tr>');
   items.sort((a,b)=>b.totalValue-a.totalValue||((total?b.totalValue/total:0)-(total?a.totalValue/total:0))||a.sku.localeCompare(b.sku,'id')).forEach(r=>rows.push('<tr class="p4-sku-row '+id+'" hidden><td class="p4-sku-indent">↳ '+p4Esc(r.sku)+'</td>'+monthIndexes.map(i=>money(r.months?.[i])).join('')+money(r.avg3)+money(r.avg6)+'<td>'+(total?((r.totalValue/total)*100).toFixed(2)+'%':'—')+'</td>'+blank.repeat(8)+'</tr>'));
  }
  rows.push('<tr class="p4-sbu-total"><td>TOTAL SBU '+p4Esc(sbu)+'</td>'+sbuMonth.map(money).join('')+money(sbuAvg3)+money(sbuAvg6)+'<td>'+(total?((sbuTotal/total)*100).toFixed(2)+'%':'—')+'</td>'+blank.repeat(8)+'</tr>');
 }
 const totalsMonth=monthIndexes.map(i=>allRows.reduce((a,r)=>a+p4Num(r.months?.[i]),0));
 rows.push('<tr class="p4-total"><td>GRAND TOTAL</td>'+totalsMonth.map(money).join('')+money(allRows.reduce((a,r)=>a+p4Num(r.avg3),0))+money(allRows.reduce((a,r)=>a+p4Num(r.avg6),0))+'<td>'+(total?'100%':'—')+'</td>'+blank.repeat(8)+'</tr>');
 table.querySelector('tbody').innerHTML=rows.join('');
 // Remember the natural initial table viewport height. Opening Brand accordions keeps this same height and scrolls inside it.
 if(scroll){requestAnimationFrame(()=>{const h=Math.max(180,Math.round(scroll.getBoundingClientRect().height));scroll.style.setProperty('--p4-initial-height',h+'px');scroll.dataset.p4InitialHeight=String(h)})}
}
function p4ToggleBrand(id){const head=document.querySelector('[data-brand="'+id+'"]');if(!head)return;const rows=document.querySelectorAll('.'+id),hide=[...rows].some(r=>r.hidden);rows.forEach(r=>r.hidden=!hide);const scroll=head.closest('.p4-scroll');if(scroll){const expanded=!!scroll.querySelector('.p4-sku-row:not([hidden])');if(expanded){const h=Number(scroll.dataset.p4InitialHeight)||Math.max(180,Math.round(scroll.getBoundingClientRect().height));scroll.style.setProperty('--p4-initial-height',h+'px');scroll.classList.add('p4-expanded')}else{scroll.classList.remove('p4-expanded');scroll.style.height='auto';scroll.style.maxHeight='none'}}const b=head.querySelector('b');if(b)b.textContent=(hide?'▾ ':'▸ ')+b.textContent.replace(/^[＋－▾▸] /,'')}
function p4Render(){if(!p4Data||!p4DataSO)return;p4$('p4TableInfoSO').textContent='Analisa khusus PESTA ke RDC • EPM BAC + EPM LSE';p4$('p4TableInfoSOO').textContent=p4Data.year+' • '+(p4Data.monthsUsed||[]).join(', ')+' • SALES_TYPE SOO';p4RenderOne(p4DataSO,'p4SkuTableSO','SO');p4RenderOne(p4Data,'p4SkuTableSOO','SOO')}
function page4Show(){mantulShowPage_('p4View');if(!p4Meta)page4Init()}
document.addEventListener('click',e=>{const root=p4$('p4View');if(!root)return;const tab=e.target.closest('#p4View .p4-subdist-tabs button');if(tab){const mode=tab.dataset.mode,value=tab.dataset.subdist;if(mode==='SO')p4SubdistSO=value;else p4SubdistSOO=value;p4RenderSubdistTabs();page4ApplyMode(mode);return}const trigger=e.target.closest('#p4View .p4-trigger');if(trigger){const f=trigger.closest('.p4-filter'),was=f.classList.contains('open');root.querySelectorAll('.p4-filter.open').forEach(x=>x.classList.remove('open'));if(!was)f.classList.add('open');return}const action=e.target.closest('#p4View .p4-menu-actions [data-action]');if(action){e.preventDefault();e.stopPropagation();const f=action.closest('.p4-filter'),a=action.dataset.action;if(a==='all'||a==='reset'){p4$(action.dataset.target)?.querySelectorAll('input[type="checkbox"]').forEach(x=>x.checked=a==='all');p4UpdateTrigger(action.dataset.target);return}if(a==='year-apply'){const selected=p4$('p4Years').querySelector('input:checked');if(selected)p4Year=Number(selected.value);p4$('p4YearTrigger').textContent=String(p4Year);p4SetDateDefaults();f?.classList.remove('open');page4Apply();return}if(a==='apply'){f?.classList.remove('open');['p4Dates','p4Pics','p4Categories'].forEach(p4UpdateTrigger);page4Apply();return}}if(!e.target.closest('#p4View .p4-filter'))root.querySelectorAll('.p4-filter.open').forEach(x=>x.classList.remove('open'))});
document.addEventListener('change',e=>{if(e.target.closest('#p4View .p4-checklist'))['p4Dates','p4Pics','p4Categories'].forEach(p4UpdateTrigger)});
document.addEventListener('input',e=>{const id=e.target.dataset.search;if(id){const q=e.target.value.toLowerCase();if(p4$(id))p4$(id).querySelectorAll('.p4-checkitem').forEach(x=>x.hidden=!!q&&!x.textContent.toLowerCase().includes(q))}});
</script>
