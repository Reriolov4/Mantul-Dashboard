<script>
let p4Meta=null,p4Data=null,p4InitBusy=false,p4Request=0,p4Subdist='SEMUA';
const p4$=id=>document.getElementById(id),p4Num=v=>Number(v||0),p4Esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p4Fmt=v=>p4Num(v).toLocaleString('id-ID',{maximumFractionDigits:1}),p4FmtValue=v=>p4Num(v).toLocaleString('id-ID',{maximumFractionDigits:0});
function p4Selected(id){return [...(p4$(id)?.querySelectorAll('input:checked')||[])].map(x=>x.value)}
function p4SelectedFilter(id){const s=p4Selected(id),n=p4$(id)?.querySelectorAll('input').length||0;return !s.length||s.length===n?[]:s}
function p4Fill(id,values){p4$(id).innerHTML=(values||[]).map(v=>'<label class="p4-checkitem"><input type="checkbox" value="'+p4Esc(v)+'" checked><span>'+p4Esc(v)+'</span></label>').join('');p4UpdateTrigger(id)}
function p4UpdateTrigger(id){const s=p4Selected(id),n=p4$(id)?.querySelectorAll('input').length||0,label=id==='p4Customers'?'Customer':'SUBDIST';p4$(id+'Trigger').textContent=!s.length||s.length===n?'Semua '+label:s.length===1?s[0]:s.length+' dipilih'}
function p4RenderSubdist(){p4$('p4SubdistPills').innerHTML=['SEMUA',...(p4Meta?.subdists||[])].map(v=>'<button type="button" data-subdist="'+p4Esc(v)+'" class="'+(p4Subdist===v?'active':'')+'">'+p4Esc(v)+'</button>').join('')}
function p4RenderFilters(){p4Fill('p4Customers',p4Meta.customers||[]);p4RenderSubdist()}
function p4Filters(){return {customers:p4SelectedFilter('p4Customers'),subdists:p4Subdist==='SEMUA'?[]:[p4Subdist]}}
function p4Busy(b){if(b)p4$('p4View').setAttribute('aria-busy','true');else p4$('p4View').removeAttribute('aria-busy')}
function page4Init(){if(p4Meta||p4InitBusy)return;p4InitBusy=true;p4Busy(true);p4$('p4Status').textContent='Membaca P2_EVENT_INDEX dan master SKU...';google.script.run.withSuccessHandler(x=>{p4InitBusy=false;p4Busy(false);if(!x?.meta||!x?.data){p4$('p4Status').textContent='Payload Page 4 tidak lengkap.';return}p4Meta=x.meta;p4RenderFilters();p4Data=x.data;p4Render();p4$('p4Status').textContent='Sumber '+x.diagnostics.source+' • '+p4Fmt(p4Meta.sooRows)+' baris SOO • '+p4Fmt(p4Meta.soModeRows)+' baris SO'}).withFailureHandler(e=>{p4InitBusy=false;p4Busy(false);p4$('p4Status').textContent='Gagal memuat Page 4: '+(e.message||e)}).getPage4InitialPayload('SOO')}
function page4Apply(){if(!p4Meta)return;const seq=++p4Request;p4Busy(true);p4$('p4Status').textContent='Menerapkan filter Customer dan SUBDIST...';google.script.run.withSuccessHandler(d=>{if(seq!==p4Request)return;p4Data=d;p4Render();p4$('p4Status').textContent=p4Fmt(d.skuCount)+' SKU • '+p4Fmt(d.matchedSourceRows)+' baris transaksi';p4Busy(false)}).withFailureHandler(e=>{if(seq!==p4Request)return;p4Busy(false);p4$('p4Status').textContent='Gagal menerapkan filter: '+(e.message||e)}).getPage4SkuData(p4Filters())}
function p4Render(){if(!p4Data)return;const d=p4Data,t=p4$('p4SkuTable');p4$('p4SkuCount').textContent=p4Fmt(d.skuCount);p4$('p4TotalValue').textContent=p4FmtValue(d.totals.value);p4$('p4TotalCarton').textContent=p4Fmt(d.totals.carton);p4$('p4TableInfo').textContent=d.year+' YTD • '+(d.monthsUsed||[]).join(', ')+' • Semua SUBDIST';t.querySelector('thead').innerHTML='<tr><th>SKU KCH</th><th>BRAND</th><th>SUBBRAND</th><th>CATEGORY</th><th>ENTITAS</th><th>VALUE</th><th>KARTON</th></tr>';t.querySelector('tbody').innerHTML=(d.rows||[]).map(r=>'<tr><td title="'+p4Esc(r.sku)+'">'+p4Esc(r.sku)+'</td><td>'+p4Esc(r.brand)+'</td><td>'+p4Esc(r.subbrand)+'</td><td>'+p4Esc(r.category)+'</td><td>'+p4Esc(r.entity)+'</td><td>'+p4FmtValue(r.total.value)+'</td><td>'+p4Fmt(r.total.carton)+'</td></tr>').join('')+'<tr class="p4-total"><td>GRAND TOTAL</td><td></td><td></td><td></td><td></td><td>'+p4FmtValue(d.totals.value)+'</td><td>'+p4Fmt(d.totals.carton)+'</td></tr>'}
function page4Reset(){if(!p4Meta)return;p4Subdist='SEMUA';p4RenderFilters();page4Apply()}
function page4Show(){mantulShowPage_('p4View');if(!p4Meta)page4Init()}
document.addEventListener('click',e=>{const f=e.target.closest('#p4View .p4-filter');if(e.target.matches('#p4View .p4-trigger')){document.querySelectorAll('#p4View .p4-filter.open').forEach(x=>{if(x!==f)x.classList.remove('open')});f.classList.toggle('open');return}if(e.target.closest('#p4View .p4-menu-actions [data-action]')){const b=e.target.closest('[data-action]'),a=b.dataset.action;if(a==='all'||a==='reset')p4$(b.dataset.target).querySelectorAll('input').forEach(x=>x.checked=a==='all');else if(a==='apply')f?.classList.remove('open');p4UpdateTrigger('p4Customers');return}const sd=e.target.closest('#p4SubdistPills button');if(sd){p4Subdist=sd.dataset.subdist;p4RenderSubdist();return}if(e.target.id==='p4Apply')page4Apply();if(e.target.id==='p4Reset')page4Reset()})
document.addEventListener('change',e=>{if(e.target.closest('#p4View .p4-checklist'))p4UpdateTrigger('p4Customers')})
document.addEventListener('input',e=>{const id=e.target.dataset.search;if(id){const q=e.target.value.toLowerCase();if(id==='p4Customers')p4$(id).querySelectorAll('.p4-checkitem').forEach(x=>x.hidden=!x.textContent.toLowerCase().includes(q))}})
</script>
